# Deploying used to be `npm run deploy` from a laptop, which meant the bundle
# that shipped carried whatever that laptop happened to have in api-key.js and
# whoever ran it was logged into wrangler. Here the key is a repository secret,
# the tree is a fresh checkout, and the only thing that reaches Cloudflare is
# dist/, rebuilt from scratch by every run.
name: Deploy

on:
  # This repository's default branch is master; the Pages project's production
  # branch is a separate setting that has been main. Both names are listed so a
  # rename of either one cannot quietly stop the trigger firing, and which of
  # them means production is asked of Cloudflare below rather than assumed.
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [preview, production]
        default: preview

# Two deploys of the same branch racing would leave the later build serving the
# earlier one's output, so they queue instead of overlapping.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A green suite is the gate this deploy path gains over running the script
      # by hand. Typecheck is not one: it has standing errors of its own.
      - name: Test
        run: npm test

      # src/services/places.js imports api-key.js by path and .gitignore keeps
      # it out of the repo, so the secret is written back into the file the
      # bundler expects. It stays on the runner; only dist/ is deployed.
      - name: Write api-key.js
        env:
          AWS_API_KEY: ${{ secrets.AWS_API_KEY }}
        run: |
          [ -n "$AWS_API_KEY" ] || { echo "AWS_API_KEY secret is empty; the build would ship a placeholder." >&2; exit 1; }
          node -e 'require("node:fs").writeFileSync("api-key.js", "export const awsApiKey = " + JSON.stringify(process.env.AWS_API_KEY) + ";\n")'

      - run: npm run build

      # dist/ is rebuilt from scratch by the build, so only built output can
      # ship. This is what replaced deploying the working directory, which once
      # published .env.
      - name: Check dist/ holds exactly what it should
        run: |
          expected=(index.html aspects.json myths.json apple-touch-icon.png)
          for f in "${expected[@]}"; do
            [[ -f "dist/$f" ]] || { echo "Build did not produce dist/$f" >&2; exit 1; }
          done
          # One page bundle, one worker, and the chunk they share.
          for kind in app worker chunk; do
            n="$(find dist -maxdepth 1 -name "$kind.*.js" | wc -l | tr -d ' ')"
            [[ "$n" == "1" ]] || { echo "Expected exactly one $kind.*.js in dist/, found $n" >&2; exit 1; }
          done
          stray="$(find dist -type f \! -name 'app.*.js' \! -name 'worker.*.js' \! -name 'chunk.*.js' $(printf '! -name %s ' "${expected[@]}"))"
          if [[ -n "$stray" ]]; then
            echo "Unexpected files in dist/:" >&2; echo "$stray" >&2; exit 1
          fi

      # A Pages deploy is production only when --branch matches the name the
      # project has set as its production branch, and a preview otherwise. That
      # name lives in Cloudflare, not here, so it is read from Cloudflare: a
      # hardcoded guess that drifted would publish production deploys to a
      # preview URL and nothing would say so.
      - name: Ask Cloudflare which branch is production
        id: pages
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -o pipefail
          project=transits-timeline
          response="$(curl -sS \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$project")"

          # Read the name before deploying anything. A bad token, a renamed
          # project or an answer shaped differently than expected stops the run
          # here, with nothing yet sent to Cloudflare.
          production="$(jq -r 'if .success != true then empty else .result.production_branch // empty end' <<< "$response" 2>/dev/null || true)"
          if [[ -z "$production" ]]; then
            echo "Could not read the production branch of Pages project '$project'." >&2
            echo "$response" >&2
            exit 1
          fi
          echo "Pages project '$project' calls '$production' production." >&2

          if [[ "$EVENT" == "push" || "$TARGET" == "production" ]]; then
            branch="$production"
            echo "Deploying to PRODUCTION as '$branch'." >&2
          elif [[ "$REF_NAME" == "$production" ]]; then
            # Publishing this ref under its own name would land on production,
            # which is the one thing a preview must not do.
            branch="preview-$REF_NAME"
            echo "Deploying preview as '$branch': '$REF_NAME' is the production branch." >&2
          else
            branch="$REF_NAME"
            echo "Deploying preview branch '$branch'; production is untouched." >&2
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned so a wrangler release cannot change what a deploy does.
          wranglerVersion: "4.128.0"
          command: pages deploy dist --project-name transits-timeline --branch ${{ steps.pages.outputs.branch }}
