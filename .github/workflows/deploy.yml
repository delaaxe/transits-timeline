# Deploying used to be `npm run deploy` from a laptop, which shipped whatever
# that laptop had in api-key.js. Here the key is a repository secret and the
# only thing that reaches Cloudflare is dist/, rebuilt from scratch each run.
#
# master is this repository's default branch. main is the name the Pages project
# has set as its production branch, which is what makes a deploy production
# rather than a preview. Every push to master publishes production.
#
# Any other branch pushed here deploys under its own name, which Pages serves as
# a preview on its own URL and never as production.
name: Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate that running the script by hand never had. Not typecheck: it
      # has standing errors of its own.
      - run: npm test

      # src/services/places.js imports api-key.js by path and .gitignore keeps
      # it out of the repo, so the secret is written back into the file the
      # bundler expects. It stays on the runner; only dist/ is deployed.
      - name: Write api-key.js
        env:
          AWS_API_KEY: ${{ secrets.AWS_API_KEY }}
        run: |
          [ -n "$AWS_API_KEY" ] || { echo "AWS_API_KEY secret is empty; the build would ship a placeholder." >&2; exit 1; }
          node -e 'require("node:fs").writeFileSync("api-key.js", "export const awsApiKey = " + JSON.stringify(process.env.AWS_API_KEY) + ";\n")'

      - run: npm run build

      # Pages reads production from the branch name it is given, so master maps
      # to main and everything else deploys as itself. Slashes are legal in the
      # name; anything else Pages does not accept is folded to a dash.
      - name: Pick the Pages branch
        id: pages
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._/-' '-')" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned so a wrangler release cannot change what a deploy does. The
          # same pin is a devDependency, so npm ci installs wrangler once, from
          # the cache, and the action finds it rather than fetching its own -
          # that fetch was never cached and cost minutes on a slow npm day. The
          # two versions have to stay equal or the action installs anyway.
          # The run writes api-key.js and dist/, so the tree is dirty by design.
          wranglerVersion: "4.128.0"
          command: pages deploy dist --project-name transits-timeline --commit-dirty=true --branch ${{ steps.pages.outputs.branch }}
