name: CI

# Deploys are local. This just says whether the chart math still holds.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Tests and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      # api-key.js is not in the repo; this proves everything bundles.
      - run: ALLOW_MISSING_API_KEY=1 npm run build
