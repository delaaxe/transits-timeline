  <style>
    :root{
      color-scheme: dark;

      /* The sky is drawn by .sky; --void is what shows during overscroll and
         before it paints. */
      --void: #06070f;

      /* Two surface tokens on purpose. Anything a bar can pass behind stays
         opaque - the sticky date axis and the corner block are the reason -
         while controls may go glass. The renderer fills its own background
         rects with --panel-bg and --axis-bg, so both alias the solid one. */
      --surface-solid: #0e1122;
      --surface-glass: rgba(14,17,34,.62);
      --surface-2: #151a30;

      --hairline: #232842;
      --hairline-soft: #191e33;

      --ink: #e9ecf7;
      --ink-soft: #a6aeca;
      --ink-dim: #949cbb;
      --ink-faint: #737b99;

      --star: #f2e4be;

      /* Row rhythm, read by the renderer: a band under every other row and a
         hairline through each. Both are white at very low alpha rather than
         opaque greys, so they hold whatever the plate is doing behind them. */
      --row-band: rgba(255,255,255,.022);
      --row-guide: rgba(255,255,255,.06);
      /* The row being followed. Warm rather than white, because it is the star
         colour saying "this is the one you asked about" - the same band the
         chips take when they are on. */
      --focus-band: rgba(242,228,190,.13);

      /* Spacing: 6 / 10 / 16 / 24, replacing a mix of six ad-hoc values. */
      --sp-1: 6px;
      --sp-2: 10px;
      --sp-3: 16px;
      --sp-4: 24px;

      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      /* The vendored face first, then the platform stack it used to rely on. */
      --font-glyph: "Transit Glyphs", "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", "Symbola", system-ui, sans-serif;

      /* Names the renderer writes straight into SVG attributes. Kept as
         aliases so no drawing code changes in this phase. */
      --bg: var(--void);
      --panel-bg: var(--surface-solid);
      --axis-bg: var(--surface-solid);
      --text: var(--ink);
      --muted: var(--ink-dim);
      --accent: var(--star);
      --accent-contrast: #06070f;
      --axis-line: #7e86a6;

      --panel-border: var(--hairline);
      --control-bg: #131731;
      --control-border: #2a3050;
      --hover: rgba(242,228,190,.10);
      --shadow: 0 16px 40px rgba(0,0,0,.55);
      --danger: #ff6b5e;

      /* Shell. The page is a column now, not the whole screen: the sky needs
         somewhere to be seen. */
      --shell-max: 1280px;
      --gutter: clamp(14px, 2.4vw, 28px);
      /* Two tokens, not one, and deliberately so: --viewbar-min sizes the bar,
         --viewbar-h is the measured result the date axis sticks below. Driving
         both from one value makes the ResizeObserver feed its own input, and a
         browser that coalesces that loop leaves the offset a few pixels short -
         which shows as a strip of rows sliding under the bar. */
      --viewbar-min: 38px;
      --viewbar-h: 52px;

      --chart-pad: 8px;
      /* Sides only: this has to equal --chart-pad or the axis ticks stop
         lining up with the bars. The top is its own value because it is pure
         sticky-header cost. */
      --axis-pad: 8px;
      --axis-pad-top: 4px;
      --timeline-nav-h: 32px;
      --timeline-nav-total: calc(var(--timeline-nav-h) + 10px);
    }

       arrive as pictures mid-line. Inlined rather than served: it is 3KB, it
       needs no request, and there is no frame where the glyphs are wrong.
       The unicode-range keeps it to exactly these symbols - every letter and
       digit still comes from the system UI font.

    html{
      min-height: 100%;
      background: var(--void);
    }
    body{
      font-family: var(--font-ui);
      max-width: var(--shell-max);
      margin: 0 auto;
      padding: 0 var(--gutter) max(18px, env(safe-area-inset-bottom));
      padding-inline: max(var(--gutter), env(safe-area-inset-left)) max(var(--gutter), env(safe-area-inset-right));
      color: var(--text);
      font-size: 16px;
      background: transparent;
      overscroll-behavior-y: none;
    }

    .appBar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      padding: max(var(--sp-2), env(safe-area-inset-top)) 0 var(--sp-2);
    }
    .wordmark{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .wordmark svg{
      width: 20px;
      height: 20px;
      flex: none;
      color: var(--star);
    }

    .sky::before,
    .sky::after{
      content: "";
      position: absolute;
      inset: -8%;
    }
    /* Near field: fewer, brighter, one of them warm. */

      background-image:
        radial-gradient(1.6px 1.6px at 40px 62px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(1.4px 1.4px at 168px 22px, rgba(242,228,190,.85), transparent 60%),
        radial-gradient(1.2px 1.2px at 96px 190px, rgba(255,255,255,.75), transparent 60%),
        radial-gradient(1.8px 1.8px at 232px 132px, rgba(255,255,255,.70), transparent 60%);
      background-size: 260px 260px;
      animation: starDrift 260s linear infinite;
    }
    /* Far field: more of them, dimmer, on a tile whose size shares no factor
       with the near one, so the two repeats never line up. */
    .sky::after{
      background-image:
        radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.55), transparent 60%),
        radial-gradient(1px 1px at 110px 96px, rgba(255,255,255,.45), transparent 60%),
        radial-gradient(1px 1px at 60px 148px, rgba(198,210,255,.45), transparent 60%),
        radial-gradient(1px 1px at 172px 58px, rgba(255,255,255,.35), transparent 60%),
        radial-gradient(1px 1px at 140px 178px, rgba(255,255,255,.40), transparent 60%);
      background-size: 190px 190px;
      opacity: .9;
      animation: starDrift 420s linear infinite reverse;
    }
    @keyframes starDrift{
      from{ transform: translate3d(0,0,0); }
      to{ transform: translate3d(-190px, -140px, 0); }
    }
    /* Still on touch: nothing compositing behind a chart while a finger is on
       the glass, and no battery spent on motion nobody asked for. */
    @media (prefers-reduced-motion: reduce), (hover: none) and (pointer: coarse){
      .sky::before,
      .sky::after{ animation: none; }
    }

    :focus-visible{
      outline: 2px solid var(--star);
      outline-offset: 2px;
    }

    .panel{
      position: relative;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: var(--sp-3);
      margin-bottom: var(--sp-3);
      background: var(--surface-glass);
      backdrop-filter: blur(10px) saturate(115%);
      -webkit-backdrop-filter: blur(10px) saturate(115%);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      .panel,
      .installHint{ background: var(--surface-solid); }
    }
    .row{ display:flex; gap:12px; flex-wrap: wrap; align-items:flex-end; }
    label{ display:block; font-size: 12px; color:var(--muted); margin-bottom: 6px; }
    input, select, button{ font: inherit; padding: 8px 10px; border:1px solid var(--control-border); border-radius: 8px; background: var(--control-bg); color: var(--text); }
    input[type="number"],
    input[type="date"],
    input[type="time"]{ font-variant-numeric: tabular-nums; }
    input[type="number"]{ width: 110px; }
    input[type="date"]{ width: 132px; } /* narrower */
    input[type="time"]{ width: 130px; }
    .field{ display:flex; flex-direction: column; }
    .field.small input, .field.small select { width: 160px; }
    .field.med input, .field.med select { width: 210px; }
    button{ cursor:pointer; border-color: var(--control-border); }
    button:disabled{ opacity:.6; cursor: not-allowed; }

    .status{ margin-top: 10px; color: var(--muted); font-size: 13px; white-space: normal; }
    .error{ color: var(--danger); }

    /* The view bar, the options drawer, the date axis and the chart are four
       elements that have to read as one plate: same surface, one border drawn
       around the outside of the set. The bar is sticky above the axis, which
       is why --viewbar-h exists - the axis sticks to the bottom edge of it. */
    .viewBar{
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--sp-1) var(--sp-2);
      min-height: var(--viewbar-min);
      /* No box-sizing reset in this file, so this padding and the border are
         added to --viewbar-min rather than contained by it. */
      padding: var(--sp-1) var(--sp-2);
      background: var(--surface-solid);
      border: 1px solid var(--hairline);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
    }
    /* Geometrically this was already centred - both ends of the bar carry the
       same ink, and its text centre matched the chips' to the pixel. What made
       it read as off was that it had no box: an underline hanging below the
       label and a caret sitting at its own height, next to four pills. It gets
       the chips' band and their padding instead, and the caret gets a gap. */
    .viewBar > .viewBarToggle{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: none;
      white-space: nowrap;
      text-decoration: none;
      /* The chips' own padding, so the hover pill is their size rather than
         the whole height of the bar. */
      padding: 6px 8px;
      border-radius: 8px;
    }
    .viewBar > .viewBarToggle:hover{ color: var(--ink); background: var(--hover); }
    /* Open reads as pressed: the chips' own active band, so the bar has one
       vocabulary rather than two. */
    .viewBar > .viewBarToggle.active{ color: var(--ink); background: var(--hover); }
    .optionsDrawer{
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      padding: var(--sp-3);
      background: var(--surface-solid);
      border-inline: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline-soft);
    }
    .dateAxisScroll{
      position: sticky;
      top: var(--viewbar-h);
      z-index: 3;
      background: var(--panel-bg);
      overflow: hidden;
      border-inline: 1px solid var(--hairline);
    }

    /* The date axis sits outside the scroller, so it used to be repositioned by
       JS on every scroll event and lagged behind touch scrolling. Tying it to a
       scroll timeline lets the compositor drive it. updateAxisTransform still
       does the work where scroll timelines are unsupported. */
    #timelineScroll{ scroll-timeline: --timelineX inline; }
    body{ timeline-scope: --timelineX; }

    @keyframes dateAxisFollow{
      from{ transform: translateX(0); }
      to{ transform: translateX(calc(-1 * var(--date-axis-travel, 0px))); }
    }

    @supports (animation-timeline: --x){
      /* Longhand on purpose: the animation shorthand resets duration to 0s,
         which finishes a scroll-driven animation instantly at 100%. */
      #dateAxisSvg{
        animation-name: dateAxisFollow;
        animation-duration: auto;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-timeline: --timelineX;
      }

      /* The label column slides and narrows over the first stretch of scroll,
         then holds. The hold is a keyframe stop rather than animation-range,
         and the values are plain lengths rather than a custom property, because
         Safari runs neither of those on a scroll timeline. syncAxisAnimations
         writes the keyframes, since the stop depends on the layout. */
      #aspectAxisWrap{ animation-name: aspectAxisNarrow; }
      #aspectAxisSvg{ animation-name: aspectAxisSlide; }
      #axisCornerBlock{ animation-name: aspectAxisCornerNarrow; }
      .timelineNav{ animation-name: aspectAxisNavIndent; }

      #aspectAxisWrap,
      #aspectAxisSvg,
      #axisCornerBlock,
      .timelineNav{
        animation-duration: auto;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-timeline: --timelineX;
      }
    }
    /* No padding between the axis and the chart: they are separate SVGs in
       separate scroll containers, and the now line has to cross from one into
       the other without a seam. */
    .dateAxisScrollInner{ padding: var(--axis-pad-top) var(--axis-pad) 0; position: relative; }
    .timelineNav{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 2px 0 4px;
      margin-left: calc(calc(var(--aspect-axis-w, 150px) + var(--aspect-axis-shift, 0px)) + var(--axis-pad));
      margin-right: 6px;
      user-select: none;
      min-height: var(--timeline-nav-h);
    }
    .timelineNavGroup{ display:flex; gap: 14px; }
    .timelineNavBtn{
      background: none;
      border: none;
      padding: 0;
      color: var(--ink-soft);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }
    .timelineNavBtn:disabled{ opacity: 0.5; cursor: not-allowed; }
    #dateAxisSvg{ will-change: transform; position: relative; z-index: 1; }
    #axisCornerBlock{
      position: absolute;
      left: var(--axis-pad);
      top: var(--axis-pad-top);
      width: calc(calc(var(--aspect-axis-w, 150px) + var(--aspect-axis-shift, 0px)) - 1px);
      height: calc(var(--date-axis-h, 80px) + var(--timeline-nav-total, 0px));
      background: var(--panel-bg);
      z-index: 2;
      pointer-events: none;
      display: none;
    }
    .chartFrame{
      position: relative;
      border: 1px solid var(--hairline);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
    }
    .timelineScroll{ border: 0; border-radius: 0; padding: 0 var(--chart-pad) var(--chart-pad); background: var(--panel-bg); overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; }
    svg{ display:block; width: 100%; }
    #aspectAxisWrap{
      position: absolute;
      left: var(--chart-pad);
      top: 0;
      z-index: 2;
      overflow: hidden;
      width: calc(var(--aspect-axis-w, 150px) + var(--aspect-axis-shift, 0px));
      pointer-events: none;
    }
    #aspectAxisSvg{
      display: block;
      transform: translateX(var(--aspect-axis-shift, 0px));
    }
    #aspectAxisSvg text,
    #dateAxisSvg text{ font-family: var(--font-glyph); }
    /* Dates sit in a row and are read by position as much as by value. */
    #dateAxisSvg text{ font-variant-numeric: tabular-nums; }
    .checks{ display:flex; gap: 14px; align-items:center; flex-wrap: wrap; padding: 6px 0 2px 0; }
    .checks label{ margin: 0; font-size: 13px; color: var(--text); display:flex; gap: 8px; align-items:center; }
    .checks input[type="checkbox"]{ width: 16px; height: 16px; accent-color: var(--star); }
    .optionsDrawer > *{ margin-top: 0; }
    .aspectDropdown{ position: relative; }
    /* A summary is display: list-item by default, which is two problems at
       once on iOS. Safari keeps drawing its disclosure triangle unless the
       display is changed - list-style: none alone does not remove it there -
       and a list-item box does not centre its own text, so the 40px minimum
       this control gets on touch stretched the pill downward and left "Aspects"
       sitting against the top of it. inline-flex settles both, and makes this
       chip line up with the button-based chips beside it. */
    .aspectDropdown > summary{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* The chips beside this are buttons, which the UA gives border-box, so
         their 40px minimum is 40px. A summary is content-box, and the same
         minimum came out 54 - the odd one out in the row. */
      box-sizing: border-box;
      list-style: none;
      cursor: pointer;
      padding: 6px 10px;
      border: 1px solid var(--control-border);
      border-radius: 8px;
      background: var(--control-bg);
      font-size: 13px;
      line-height: 1.2;
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .aspectDropdown > summary::-webkit-details-marker,
    .aspectDropdown > summary::marker{ display: none; content: ""; }
    .aspectDropdown[open] > summary{ background: var(--star); border-color: var(--star); color: var(--accent-contrast); }
    /* A list rather than a wrapped row: five rows with a tick at one end and
       "only" at the other read as five choices, where a line of them read as
       one paragraph of glyphs. */
    #aspectChecks{ display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 0; }
    .aspectRow{ display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
    .aspectRow label{ flex: 1; }
    .aspectOnly{
      border: 0;
      background: none;
      padding: 2px 0;
      font-size: 12px;
      color: var(--ink-faint);
      cursor: pointer;
    }
    .aspectOnly:hover{ color: var(--star); text-decoration: underline; }
    .aspectPanelHead{
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--hairline-soft);
    }
    .aspectPanelTitle{
      flex: 1;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .aspectDropdown .aspectPanel{
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      padding: var(--sp-2);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: var(--surface-solid);
      box-shadow: var(--shadow);
      min-width: 220px;
      z-index: 20;
    }

    .inlineHint{ font-size: 12px; color: var(--muted); margin-left: 2px; margin-right: 2px; }
    /* The chips and the one action that is about all of them, rather than
       about the selected chart the way the links below the row are. */
    #personalSection{ padding-right: 42px; }
    #transferBtn{
      position: absolute;
      top: var(--sp-2);
      right: var(--sp-2);
    }
    /* An icon that has to be hit with a thumb: the glyph stays 18px, the box
       around it grows on touch the way the chips do. */
    .iconBtn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 0;
      border-radius: 8px;
      padding: 6px;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .iconBtn:hover{ color: var(--ink); background: var(--hover); }
    .iconGlyph{ width: 18px; height: 18px; flex: none; display: block; }
    .appModeLink{ display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
    .appModeLabel{ text-decoration: underline; }
    .appModeLink.active .appModeLabel{ text-decoration: none; }
    .chartLinks{ display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .chartPrivacy{ margin-top: 8px; font-size: 12px; color: var(--muted); }
    .inlineDot{ color: var(--muted); margin: 0; }
    /* Any author rule that sets display beats the user agent's
       [hidden]{display:none}, and this file has sprung that trap three times -
       the options rows, the state plate, and the compose picker, each of which
       ignored its hidden attribute the moment something gave it a display. The
       JS toggles .hidden throughout; this makes that mean what it says, once. */
    [hidden]{ display: none !important; }

    
    .orbField input{ width: 70px !important; }
    .orbInline{ display:flex; align-items:center; gap: 8px; }
    .orbInline label{ margin: 0; font-size: 12px; color: var(--muted); }
    .smallBtn{ padding: 6px 10px; font-size: 13px; border-radius: 8px; }

    
    .typeahead{ position: relative; }
    .suggestBox{
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface-solid);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      box-shadow: var(--shadow);
      max-height: 260px;
      overflow: auto;
      z-index: 30;
    }
    .suggestItem{ padding: 10px 12px; cursor: pointer; }
    .suggestItem:hover{ background: var(--hover); }
    .suggestTitle{ font-size: 14px; }
    .suggestSub{ font-size: 12px; color: var(--muted); margin-top: 2px; }
    .rowTop{ align-items: flex-end; }
    .tinyHelp{ font-size: 12px; color: var(--muted); margin-top: 6px; }
    
    .chartSummary{
      font-size: 13px;
      color: var(--muted);
      padding: 6px 0 0 0;
      line-height: 1.35;
      white-space: pre-line;
    }
    .symbolGlyphText{
      font-family: var(--font-glyph);
      font-size: 14px;
    }
    .composeHint{
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .composeStopRow{
      margin-top: 4px;
      display: flex;
      justify-content: flex-start;
    }
    .btnSmallPrimary{
      background: var(--star);
      color: var(--accent-contrast);
      border: 1px solid var(--star);
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 8px;
    }
    .btnSmallPrimary:hover{ opacity: .92; }

    .btnGhost{
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
    }

    /* Charts move between devices as a file, so both ends need the same
       thing: a list of charts with a checkbox each. One dialog does both. */
    .transferDialog{
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: var(--surface-solid);
      color: var(--ink);
      box-shadow: var(--shadow);
      padding: 0;
      width: min(420px, calc(100vw - 32px));
    }
    .transferDialog::backdrop{ background: rgba(0,0,0,0.5); }
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      .transferDialog::backdrop{
        background: rgba(0,0,0,0);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
    }
    .transferBody:focus{ outline: none; }
    .transferBody{ position: relative; padding: var(--sp-3); display: flex; flex-direction: column; gap: var(--sp-2); }
    .transferTitle{ font-size: 15px; padding-right: 44px; }
    /* The same 44px corner target as the transit popup, so the two dialogs
       are dismissed the same way. */
    .transferClose{
      position: absolute;
      top: 4px;
      right: 4px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      border-radius: 10px;
    }
    .transferClose:hover{ background: var(--hover); color: var(--ink); }
    .transferHint{ font-size: 12px; color: var(--muted); }
    .transferList{ max-height: 46vh; overflow: auto; display: flex; flex-direction: column; }
    .transferItem{
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 8px 2px;
      border-bottom: 1px solid var(--hairline-soft);
      cursor: pointer;
    }
    .transferItem:last-child{ border-bottom: 0; }
    .transferItem input{ margin: 0; }
    .transferItemText{ min-width: 0; }
    .transferItemName{ font-size: 14px; }
    .transferItemSub{ font-size: 12px; color: var(--muted); margin-top: 2px; }
    .transferPaste{
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--ink-soft);
      min-height: 120px;
      resize: vertical;
    }
    /* Choosing which charts sits with the list it acts on; the buttons that
       leave the dialog sit together in the footer. Keeping those two apart is
       what stops "Select none" reading as another way out of here. */
    .transferListHead{ display: flex; justify-content: flex-end; }
    .transferActions{ display: flex; align-items: center; gap: var(--sp-2); }
    .transferActions button{ white-space: nowrap; }
    /* The way out of this mode sits at the far left, the buttons that act at
       the far right. On a phone the row runs out of width, so the link drops to
       a line of its own - the acting buttons stay together, which is the pair
       that has to be read as a pair. */
    .transferFooter{ margin-top: var(--sp-1); flex-wrap: wrap; justify-content: flex-end; }
    #transferModeBtn{ margin-right: auto; }
    .transferFooterActs{ display: flex; align-items: center; gap: var(--sp-2); margin-left: auto; }

    .statusRow{ display:flex; align-items:center; gap: var(--sp-2); flex-wrap: wrap; }
    .statusRow .status{ margin-top: 0; }
    .linkBtn{
      background: none;
      border: none;
      padding: 0;
      color: var(--ink-soft);
      cursor: pointer;
      text-decoration: underline;
      font-size: 13px;
    }
    .linkBtn:hover{ opacity: .75; }

    /* Size for the hand, not for the viewport. An iPad mini in landscape is
       1133px wide and still held in two hands, so this keys off the pointer
       rather than a breakpoint. --timeline-nav-total follows automatically,
       which is what keeps the corner block covering the nav. */
    @media (hover: none) and (pointer: coarse){
      :root{
        --timeline-nav-h: 44px;
        --viewbar-min: 60px;
        --viewbar-h: 60px;
      }
      .timelineNavBtn{ min-width: 44px; min-height: 44px; }
      .presetBtn,
      .chartBtn,
      .aspectDropdown > summary{ min-height: 40px; padding-inline: 14px; }
      .bodyChip{ min-width: 44px; min-height: 40px; }
      .rowFocus .smallBtn{ min-height: 36px; }
      /* The chips are what a selection is made of; these name a whole set at
         once and are re-tapped in a second if one is missed, so they get the
         checkbox row's height rather than the chips'. */
      .bodyPresetBtn{ min-height: 30px; }
      .bodyModeBtn{ min-height: 34px; }
      .viewBar > .viewBarToggle{ min-height: 40px; padding: 6px 8px; }
      .linkBtn{ padding: 8px 0; }
      .checks label{ min-height: 32px; }
      /* Safari zooms the page in whenever it focuses a field set below 16px,
         and "Import charts instead" focuses this one the moment it is tapped.
         The dense 12px is a desktop nicety; keeping the page where the reader
         left it matters more. */
      .transferPaste{ font-size: 16px; }
    }

    /* Scrolled, the view bar and the date axis are the entire header, and on a
       long list they are the only thing between the reader and more rows. The
       bar gives back what it can. Fine pointers only: 44px targets are not
       negotiable on touch, and this is the case the desktop asked about. */
    @media (hover: hover) and (pointer: fine){
      body.scrolled{ --viewbar-min: 28px; }
      body.scrolled .viewBar{ padding-block: 2px; }
      body.scrolled .presetBtn{ padding-block: 4px; }
      body.scrolled .viewBar > .viewBarToggle{ padding-block: 4px; }
    }

    /* A phone in landscape is under 400px tall: every row of chrome above the
       chart is a row of transits that is not on screen. Targets come down to
       36px here, below the 44 this file uses everywhere else - a deliberate
       trade in the one orientation where height is the scarce thing. */
    @media (max-height: 520px){
      :root{ --viewbar-min: 46px; }
      .appBar{ padding: max(4px, env(safe-area-inset-top)) 0 4px; }
      .wordmark{ font-size: 13px; }
      .wordmark svg{ width: 17px; height: 17px; }
      .panel{ padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2); }
      .viewBar{ min-height: 46px; padding-block: 2px; }
      .presetBtn,
      .chartBtn,
      .aspectDropdown > summary{ min-height: 36px; }
      .viewBar > .viewBarToggle{ min-height: 36px; padding: 6px 8px; }
      .linkBtn{ padding: 4px 0; }
      .optionsDrawer{ padding: var(--sp-2) var(--sp-3); gap: var(--sp-1); }
      .installHint{ display: none; }

      /* The chart picker is three stacked rows for something that is chosen
         once and then left alone. Landscape gets it as one line. */
      .chartField{ flex-direction: row; align-items: center; gap: var(--sp-2); }
      .chartField > label{ margin-bottom: 0; white-space: nowrap; }
      .chartPickers{ flex-direction: row; align-items: center; flex-wrap: wrap; gap: var(--sp-2); }
      .chartPicker{ display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); }
      .chartLinks{ margin-top: 0; }
    }

    @media (max-width: 520px){
      :root{ --chart-pad: 0px; --axis-pad: 0px; }

      /* The plate goes edge to edge by taking the page's gutters away, not by
         being 100vw wide. 100vw counts the scrollbar where the scrollbar takes
         layout space, which put the right-hand end of the view bar - the
         options toggle - just off screen on a narrow desktop window. */
      body{ padding-inline: 0; }
      .appBar,
      .panel,
      .installHint{
        margin-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
      }
      .viewBar,
      .optionsDrawer,
      .dateAxisScroll,
      .chartFrame{
        border-inline: 0;
        border-radius: 0;
      }
      .viewBar,
      .optionsDrawer{
        padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
      }
      .presetBtn{ padding-inline: 10px; }
      .dateAxisScrollInner{ padding: 0; }
      .timelineScroll{ padding: 0; border-radius: 0; width: 100%; margin: 0; }
      /* The inner scroller loses its top padding here, so the block has to
         start at the very top of the plate: at --axis-pad-top the month title
         surfaced above it for those few pixels while the axis was dragged. */
      #axisCornerBlock{
        display: block;
        top: 0;
        height: calc(var(--date-axis-h, 80px) + var(--timeline-nav-total, 0px) + var(--axis-pad-top));
      }
      .timelineNavGroup:last-child .timelineNavBtn:last-child{ margin-right: 10px; }
    }

    .chartButtons{ display:flex; gap: 8px; flex-wrap: wrap; }
    .chartBtn{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      font-size: 13px;
      cursor: pointer;
      /* The chips own every gesture that starts on them. pan-y was the obvious
         choice - keep vertical page scroll working - but iOS latches
         touch-action at touchstart and claims the gesture the moment the
         finger moves, cancelling the drag before it starts. Scrolling still
         works everywhere around them, the row being two lines at most. */
      touch-action: none;
      /* WebKit needs the prefix, and the callout is the other half of it: on
         iOS a press held on a chip pops the magnifier and selects its label
         before a drag has travelled far enough to be a drag. */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The dragged chip is the preview: it is translated by script to follow the
       pointer, so the lift is everything except a transform. */
    .chartBtn.dragging{
      position: relative;
      z-index: 5;
      cursor: grabbing;
      opacity: 0.9;
      pointer-events: none;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    .chartButtons.reordering{ user-select: none; -webkit-user-select: none; }
    /* A drag can travel off the chips and over the panel, and on iOS the
       selection follows it there, so the whole page stops selecting for as
       long as one is in flight. */
    body.reorderingCharts,
    body.reorderingCharts *{
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    .chartButtons.reordering .chartBtn{ cursor: grabbing; }
    .chartBtn.active{
      background: var(--star);
      border-color: var(--star);
      color: var(--accent-contrast);
    }
    .chartBtn.add{
      border-style: dashed;
    }
    .chartPickers{ display: flex; flex-direction: column; gap: 10px; }
    .chartPickerLabel{ font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .appModeLinks{
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .appModeLink{ font-size: 15px; }
    .appModeLink.active{ font-weight: 700; color: var(--star); }

    /* The body chooser. Two panes side by side where there is room for them and
       stacked where there is not, because the two ends of a transit are one
       question - "these bodies, against those points" - and reading it as one
       line is what a pair of tabs would have taken away. */
    .bodyPicker{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-3) var(--sp-4);
    }
    .bodyPane{ min-width: 0; }
    /* A heading, not another word in the row of words under it. Set in small
       caps and tracked out, it stops reading as the first item of the preset
       list - which is exactly what a 12px muted phrase directly above a line of
       12px muted phrases was doing. */
    .bodyPaneTitle{
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 6px;
    }
    /* Words with room around them, not another row of pills. Outlining these
       put three ranks of enclosed shapes in a column - preset, chip, chip - and
       the drawer read as one dense block; the heading above them is what says
       where the list starts, and space is what says these are a list. */
    .bodyPresets{ display: flex; flex-wrap: wrap; gap: 2px 14px; margin-bottom: 10px; }
    .bodyPresetBtn{
      padding: 2px 0;
      border: 0;
      border-radius: 0;
      background: none;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.35;
      cursor: pointer;
      white-space: nowrap;
    }
    .bodyPresetBtn:hover{ color: var(--ink); text-decoration: underline; }
    /* Lit rather than filled: a preset that matches is describing the chips
       below, and a solid pill would read as the selection itself. */
    .bodyPresetBtn.on{ color: var(--star); font-weight: 600; }
    /* The two that clear or copy rather than name a set of bodies. */
    .bodyPresetBtn.ghost{ color: var(--ink-faint); }
    .bodyChips{ display: flex; flex-wrap: wrap; gap: 7px; }
    /* A glyph and nothing else, so the chip is a target rather than a word: the
       box is sized by its minimum rather than by what is in it, and every chip
       in the row is the same width whatever it holds. */
    .bodyChip{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-width: 34px;
      min-height: 30px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      color: var(--ink-soft);
      font-family: var(--font-glyph);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .bodyChip.lettered{ font-family: var(--font-ui); font-size: 14px; }
    .bodyChip:hover{ border-color: var(--star); color: var(--ink); }
    .bodyChip.on{
      background: var(--star);
      border-color: var(--star);
      color: var(--accent-contrast);
    }
    /* Which question is being asked. It sits above the lists rather than under
       them because it decides what lists there are: "involving" has one, and
       nothing to say about direction. Two chips in one shell, because it is one
       choice with two settings rather than two things that can both be on. */
    .bodyMode{
      grid-column: 1 / -1;
      justify-self: start;
      display: inline-flex;
      border: 1px solid var(--control-border);
      border-radius: 999px;
      overflow: hidden;
    }
    .bodyPicker.oneList .bodyPane{ grid-column: 1 / -1; }
    .bodyModeBtn{
      padding: 4px 10px;
      border: 0;
      border-radius: 0;
      background: none;
      color: var(--ink-soft);
      font-size: 12px;
      cursor: pointer;
    }
    .bodyModeBtn:hover{ background: var(--hover); color: var(--ink); }
    .bodyModeBtn.on{ background: var(--star); color: var(--accent-contrast); }
    /* Two panes side by side on a phone are two columns three chips wide, and
       every name in them wraps. One under the other instead. This sits with the
       rule it overrides rather than with the other narrow-screen rules further
       up the file: they have the same specificity, so whichever is written last
       is the one that applies. */
    @media (max-width: 700px){
      .bodyPicker{ grid-template-columns: 1fr; }
    }

    /* The bar that follows one row. It is a line of the view bar rather than
       something below it, so the sticky date axis clears it without being told:
       --viewbar-h is measured from the bar's real height. */
    /* Two children, and only the inner one wraps. The row is a title, three
       buttons and a result, which on a phone is more than one line - and the
       way out of the mode was being carried down with them by a margin that
       pushed it right, so it ended up alone at the bottom of a bar it belongs
       at the top of. It is a sibling of the wrapping part now, pinned to the
       first line whatever that part does. */
    .rowFocus{
      flex: 1 0 100%;
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: var(--sp-1);
      padding-top: var(--sp-1);
      border-top: 1px solid var(--hairline-soft);
    }
    .rowFocusMain{
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--sp-1);
    }
    .rowFocusTitle{
      font-size: 15px;
      color: var(--accent);
      font-weight: 700;
      /* Glyphs are already short; this is the guard for whatever is put here
         next, so a long label shortens itself rather than reflowing the row. */
      max-width: 40%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rowFocus .smallBtn{ padding: 4px 8px; font-size: 12px; }
    .rowFocusResult{ font-size: 12px; color: var(--muted); min-width: 0; }
    .rowFocusClear{ flex: none; }
    /* Below about 360px the three buttons and the title are a few pixels wider
       than the bar, and "Only this" drops. The row keeps the fuller label
       wherever it fits and gives up the one word it can spare where it does
       not - the aspects panel calls the same action "only" already. */
    @media (max-width: 360px){
      .rowFocus .wideWord{ display: none; }
      .rowFocus{ gap: 4px; }
      .rowFocus .smallBtn{ padding: 4px 6px; }
    }

    /* The label column answers a tap now, so its rows - and only its rows - take
       pointer events back from the wrapper. The wrapper stays transparent to
       them: it is an overlay across the top of a chart that scrolls sideways
       under it, and a drag that starts anywhere else on it still belongs to the
       chart. What a drag that starts on a row does is settled in the renderer,
       which ignores a click that travelled. */
    #aspectAxisSvg .rowLabelHit{
      pointer-events: auto;
      cursor: pointer;
      touch-action: pan-y;
    }
    #aspectAxisSvg .rowLabelHit:hover{ fill: var(--hover); }

    .presetButtons{ display:flex; gap: 8px; flex-wrap: wrap; }
    .presetBtn{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      font-size: 13px;
      cursor: pointer;
    }
    .presetBtn.active{
      background: var(--star);
      border-color: var(--star);
      color: var(--accent-contrast);
    }

    #tooltip{
      position: fixed; z-index: 9999; left: 0; top: 0; display: none; pointer-events: none;
      padding: 14px 16px; border-radius: 14px; background: var(--surface-solid); color: var(--text);
      border: 1px solid var(--hairline);
      font-size: 14px; line-height: 1.45; width: min(92vw, 560px); box-shadow: var(--shadow);
      white-space: normal; visibility: hidden;
    }
    /* Following a cursor, it is a label: narrow, and read in a glance. Opened
       by a tap it is a card, and gets the full measure. */
    #tooltip:not(.popup){
      width: max-content;
      max-width: min(92vw, 420px);
      padding: 10px 12px;
    }
    #tooltipBackdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9998;
      display: none;
    }
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      #tooltipBackdrop{
        background: rgba(0,0,0,0);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
    }
    #tooltip.popup{
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }
    /* 44px of target for a 12px glyph: this is the control people reach for
       first on a phone, and it used to be a 20px square in a corner. */
    #tooltip .tooltipClose{
      position: absolute;
      right: 4px;
      top: 4px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      border-radius: 10px;
    }
    #tooltip .tooltipClose:hover{ background: var(--hover); color: var(--ink); }
    #tooltip .tooltipTitle{
      font-family: var(--font-glyph);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .01em;
      padding-right: 44px;
    }
    #tooltip:not(.popup) .tooltipTitle{ padding-right: 0; font-size: 15px; }
    #tooltip.popup .tooltipTitle{ cursor: pointer; }
    #tooltip .copiedHint{
      margin-left: 6px;
      color: var(--muted);
      font-size: 13px;
      opacity: 0;
      transition: none;
    }
    #tooltip .copiedHint.visible{
      opacity: 0.65;
      transition: none;
    }
    #tooltip .copiedHint.fading{
      opacity: 0;
      transition: opacity 700ms ease;
    }
    #tooltip .desc{ color: var(--ink); margin-top: 10px; }
    /* The range and the exact time are data, not prose: they get the label
       treatment - smaller, dimmer, tabular - so the eye skips them or lands on
       them deliberately. */
    #tooltip .sub{
      color: var(--ink-dim);
      margin-top: 2px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: normal;
    }
    /* Pace and repeat passes: the same label treatment as the range, because it
       is the same kind of fact about when rather than about what. */
    #tooltip .timing{
      color: var(--ink-dim);
      margin-top: 10px;
      font-size: 13px;
    }
    #tooltip .desc + .mythToggle,
    #tooltip .timing + .mythToggle,
    #tooltip .tooltipCalendarBlock{
      border-top: 1px solid var(--hairline-soft);
      padding-top: 10px;
    }
    #tooltip .myth{ color: var(--ink-soft); margin-top: 6px; font-style: italic; }
    #tooltip .mythToggle{
      margin-top: 10px;
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    #tooltip .tooltipCalendarBlock{
      margin-top: 12px;
      color: var(--ink-dim);
    }
    #tooltip .tooltipActions{
      font-size: 13px;
      line-height: 1.4;
      display: block;
    }
    #tooltip .tooltipActionsLabel{ margin-right: 0; }
    #tooltip .tooltipActionsSep{
      opacity: 0.75;
      margin: 0;
    }
    #tooltip .tooltipAction{
      color: var(--star);
      text-decoration: underline;
      font-size: 13px;
      display: inline-block;
      padding: 6px 4px;
      border-radius: 6px;
      margin: 2px 0;
    }
    #tooltip .tooltipAction:active{ background: var(--hover); }
    .bar{ cursor: pointer; }

    /* Computing, empty and error were three strings in a status line that only
       exists while the options drawer is open. They are plates on the chart
       now, where whatever they are about would have been. */
    /* With the SVGs blanked the frame has nothing to paint, so the sky would
       show through the middle of the plate. */
    .chartFrame.hasState{ min-height: 190px; background: var(--surface-solid); }
    .timelineState{
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: var(--sp-4);
      text-align: center;
      /* Nothing in a plate is interactive, and it covers the whole chart. */
      pointer-events: none;
    }
    /* Hiding is handled by the global [hidden] rule; before that existed this
       plate laid itself over the bars and took every hover, tap and swipe. */
    .timelineStatePlate{
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: var(--surface-2);
      padding: 14px 18px;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.5;
      max-width: 36ch;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .timelineState.error .timelineStatePlate{
      color: var(--danger);
      border-color: rgba(255,107,94,.35);
    }
    .timelineState.busy .timelineStatePlate::before{
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--star);
      flex: none;
      animation: statePulse 1.1s ease-in-out infinite;
    }
    @keyframes statePulse{
      0%, 100%{ opacity: .25; transform: scale(.85); }
      50%{ opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce){
      .timelineState.busy .timelineStatePlate::before{ animation: none; opacity: .8; }
    }
    .installHint{
      margin: var(--sp-3) 0 0;
      padding: var(--sp-2) 12px;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: var(--surface-glass);
      backdrop-filter: blur(10px) saturate(115%);
      -webkit-backdrop-filter: blur(10px) saturate(115%);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    .installHintTitle{
      color: var(--text);
      font-weight: 600;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="sky" aria-hidden="true"></div>

  <header class="appBar">
    <span class="wordmark">
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M6 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path d="M20 8l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="currentColor" />
      </svg>
      Transits
    </span>
    <div class="appModeLinks" role="listbox" aria-label="Mode">
      <button id="appModePersonalBtn" type="button" class="linkBtn appModeLink active" aria-selected="true">
        <svg class="iconGlyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span class="appModeLabel">Personal</span>
      </button>
      <span class="inlineDot" aria-hidden="true">•</span>
      <button id="appModeWorldBtn" type="button" class="linkBtn appModeLink" aria-selected="false">
        <svg class="iconGlyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M4 12h16M12 4c2.4 2.2 3.6 5 3.6 8s-1.2 5.8-3.6 8c-2.4-2.2-3.6-5-3.6-8s1.2-5.8 3.6-8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span class="appModeLabel">World</span>
      </button>
    </div>
  </header>

  <div class="panel" id="personalPanel">
    <button id="transferBtn" type="button" class="iconBtn" title="Import or export charts" aria-label="Import or export charts">
      <svg class="iconGlyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M5 8h12m0 0-3-3m3 3-3 3M19 16H7m0 0 3-3m-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <div id="personalSection">
    <div class="row rowTop">
      <div class="field med chartField" style="min-width: 260px; flex: 1;">
        <label>Chart</label>
        <div class="chartPickers">
          <div class="chartPicker">
            <div id="chartButtons" class="chartButtons" role="listbox" aria-label="Chart A"></div>
            <div class="chartLinks" id="chartLinks">
              <button id="chartSummaryToggle" type="button" class="linkBtn" aria-expanded="false">Show data</button>
              <span class="inlineDot" id="composeDot">·</span>
              <button id="composeToggle" type="button" class="linkBtn" aria-expanded="false">Compose</button>
              <span class="inlineDot" id="deleteDot">·</span>
              <button id="deleteChartBtn" type="button" class="linkBtn" title="Delete chart" aria-label="Delete chart">Delete</button>
            </div>
            <div id="chartPrivacy" class="chartPrivacy" hidden>Your data is private (stored locally).</div>
          </div>
          <div class="chartPicker" id="chartPickerB" hidden>
            <div class="chartPickerLabel">Compose with</div>
            <div id="chartButtonsB" class="chartButtons" role="listbox" aria-label="Chart B"></div>
          </div>
          <div id="composeHint" class="composeHint" hidden></div>
          <div id="composeStopRow" class="composeStopRow" hidden>
            <button id="composeStopBtn" type="button" class="linkBtn">Stop composing</button>
          </div>
        </div>
      </div>
    </div>
    <div id="chartSummary" class="chartSummary" hidden></div>

    <div id="addChartPanel" class="row rowTop" style="margin-top:10px; display:none;">
      <div class="field med"><label>Name</label><input id="addChartName" type="text" placeholder="Name" /></div>
      <div class="field med"><label>Birth date</label><input id="addChartBirthDate" type="date" value="1990-09-01" /></div>
      <div class="field med"><label>Birth time (local)</label><input id="addChartBirthTime" type="time" value="18:11" step="60" /></div>

      <div class="field med typeahead">
        <label>Birth place</label>
        <input id="placeSearch" type="text" placeholder="City, country" autocomplete="off" />
        <div id="placeSuggest" class="suggestBox" hidden></div>
      </div>

      <div class="field small"><label>&nbsp;</label><button id="saveChartBtn" type="button" class="btnSmallPrimary">Save</button></div>
      <div class="field small"><label>&nbsp;</label><button id="cancelAddBtn" type="button" class="btnGhost">Cancel</button></div>
    </div>
    </div>
  </div>

<div id="mainContent">
  <div class="viewBar" id="viewBar">
    <div id="presetButtons" class="presetButtons" role="listbox" aria-label="Preset"></div>
    <button id="advancedToggle" type="button" class="linkBtn viewBarToggle" aria-expanded="false" title="Options" aria-label="Options">
      <svg class="iconGlyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 8h10M18 8h2M4 16h4M12 16h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="16" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8" />
        <circle cx="10" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8" />
      </svg>
    </button>
    <div class="rowFocus" id="rowFocus" role="status" aria-live="polite" hidden>
      <div class="rowFocusMain">
        <span class="rowFocusTitle symbolGlyphText" id="rowFocusTitle"></span>
        <button id="rowFocusPrev" type="button" class="smallBtn">‹ Last time</button>
        <button id="rowFocusNext" type="button" class="smallBtn">Next time ›</button>
        <button id="rowFocusOnly" type="button" class="smallBtn">Only<span class="wideWord"> this</span></button>
        <span class="rowFocusResult" id="rowFocusResult"></span>
      </div>
      <button id="rowFocusClear" type="button" class="iconBtn rowFocusClear" aria-label="Stop following this row">✕</button>
    </div>
  </div>

  <div class="optionsDrawer" data-advanced>
    <div class="row optionsRow">
      <div class="field"><label>Start</label><input id="rangeStart" type="date" value="2025-10-01" /></div>
      <div class="field"><label>End</label><input id="rangeEnd" type="date" value="2026-12-31" /></div>
    </div>

    <div class="bodyPicker" id="bodyPicker">
      <div class="bodyMode" id="bodyModeWrap" role="group" aria-label="Question">
        <button type="button" class="bodyModeBtn" data-body-mode="directed">Transiting → natal</button>
        <button type="button" class="bodyModeBtn" data-body-mode="involving">Involving</button>
      </div>
      <div class="bodyPane" id="transitPane">
        <div class="bodyPaneTitle" id="transitPaneTitle">Transiting</div>
        <div class="bodyPresets" id="transitBodyPresets"></div>
        <div class="bodyChips" id="transitBodyChips" role="group" aria-label="Transiting bodies"></div>
      </div>
      <div class="bodyPane" id="natalPane">
        <div class="bodyPaneTitle">Natal points</div>
        <div class="bodyPresets" id="natalBodyPresets"></div>
        <div class="bodyChips" id="natalBodyChips" role="group" aria-label="Natal points"></div>
      </div>
    </div>

    <div class="checks" id="topChecks">
      <details class="aspectDropdown">
        <summary>Aspects</summary>
        <div class="aspectPanel">
          <div class="aspectPanelHead">
            <span class="aspectPanelTitle">Aspects</span>
            <button type="button" class="linkBtn" id="aspectsAllBtn">All</button>
            <span class="inlineDot">·</span>
            <button type="button" class="linkBtn" id="aspectsNoneBtn">None</button>
          </div>
          <div class="checks" id="aspectChecks"></div>
          <div class="orbInline orbField" style="margin-top: 8px;">
            <label for="orb">Orb (°)</label>
            <input id="orb" type="number" value="1.0" step="0.1" />
          </div>
        </div>
      </details>
    </div>

    <div class="statusRow">
      <button id="updateBtn" type="button" class="linkBtn" style="display:none;">Cancel</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="dateAxisScroll" id="dateAxisScroll">
    <div class="dateAxisScrollInner">
      <div class="timelineNav" data-advanced>
        <div class="timelineNavGroup">
          <button class="timelineNavBtn" id="rangeShiftBack" type="button" aria-label="Shift range backward" title="Shift backward">‹</button>
          <button class="timelineNavBtn" id="rangeExpandBack" type="button" aria-label="Extend range backward" title="Extend backward">«</button>
        </div>
        <div class="timelineNavGroup">
          <button class="timelineNavBtn" id="rangeExpandForward" type="button" aria-label="Extend range forward" title="Extend forward">»</button>
          <button class="timelineNavBtn" id="rangeShiftForward" type="button" aria-label="Shift range forward" title="Shift forward">›</button>
        </div>
      </div>
      <svg id="dateAxisSvg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-label="Date axis"></svg>
      <div id="axisCornerBlock" aria-hidden="true"></div>
    </div>
  </div>
  <div class="chartFrame">
    <div id="aspectAxisWrap">
      <svg id="aspectAxisSvg" width="160" height="280" viewBox="0 0 160 280" role="img" aria-label="Aspect axis"></svg>
    </div>
    <div class="timelineScroll" id="timelineScroll">
      <svg id="timelineSvg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Transit timeline"></svg>
    </div>
    <div id="timelineState" class="timelineState" role="status" aria-live="polite" hidden></div>
    <div id="moreWrap" style="margin-top: 8px; display: none; padding-left: 245px;">
      <button id="showMoreBtn" class="linkBtn" type="button">Show 50 more</button>
    </div>
  </div>
  </div>
  <div id="installHint" class="installHint" hidden>
    <div class="installHintTitle">Add this app to your home screen</div>
    <div id="installHintText"></div>
  </div>
  <div id="tooltipBackdrop" aria-hidden="true"></div>
  <div id="tooltip" aria-hidden="true"></div>

  
  <dialog id="transferDialog" class="transferDialog" aria-labelledby="transferTitle">
    <div class="transferBody" tabindex="-1" autofocus>
      <button id="transferCloseBtn" class="transferClose" type="button" aria-label="Close">✕</button>
      <div class="transferTitle" id="transferTitle">Export charts</div>
      <div class="transferHint" id="transferHint"></div>
      <div class="transferListHead" id="transferListHead">
        <button id="transferAllBtn" type="button" class="linkBtn">Select all</button>
      </div>
      <div class="transferList" id="transferList"></div>
      <textarea id="transferPaste" class="transferPaste" hidden autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste AAF chart data here" aria-label="Data to import"></textarea>
      <input id="transferFile" type="file" accept=".aaf,text/plain" hidden aria-label="File to open" />
      <div class="transferActions transferFooter">
        <button id="transferModeBtn" type="button" class="linkBtn">Import charts instead</button>
        <div class="transferFooterActs">
          <button id="transferFileBtn" type="button" class="btnGhost">Choose a file</button>
          <button id="transferCopyBtn" type="button" class="btnGhost">Copy data</button>
          <button id="transferConfirmBtn" type="button" class="btnSmallPrimary">Download</button>
        </div>
      </div>
    </div>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
