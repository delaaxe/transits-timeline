<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Transits Timeline</title>
  <script>
    if (location.hostname === "transits-timeline.pages.dev" || location.hostname === "www.transits.me") {
      location.replace(`https://transits.me${location.pathname}${location.search}${location.hash}`);
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f0f6fc' stroke-width='2'/%3E%3Cpath d='M6 16h8' stroke='%23f0f6fc' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M20 8l2 4 4 2-4 2-2 4-2-4-4-2 4-2z' fill='%23f0f6fc'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <style>
    :root{
      color-scheme: dark;
      --bg: #0d1117;
      --panel-bg: #121823;
      --panel-border: #273142;
      --control-bg: #0f1520;
      --control-border: #2f3a4d;
      --text: #e6edf3;
      --muted: #9aa7b5;
      --accent: #f0f6fc;
      --accent-contrast: #0d1117;
      --axis-bg: #121823;
      --axis-line: #c2c9d2;
      --hover: rgba(255,255,255,0.08);
      --shadow: 0 10px 24px rgba(0,0,0,.45);
      --danger: #f87171;
      --chart-pad: 8px;
      --axis-pad: 8px;
      --timeline-nav-h: 32px;
      --timeline-nav-total: calc(var(--timeline-nav-h) + 10px);
    }
    html, body{
      min-height: 100%;
      background-color: var(--bg);
    }
    html{ height: 100%; }
    html{ background: var(--bg); }
    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0 18px 18px;
      color:var(--text);
      font-size: 16px;
      background: var(--bg);
      overscroll-behavior-y: none;
    }
    body::before{
      content: "";
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: -1;
      pointer-events: none;
    }
    @supports (-webkit-touch-callout: none){
      html{ height: -webkit-fill-available; }
      body{ min-height: -webkit-fill-available; }
    }
    @supports (height: 100dvh){
      body{ min-height: 100dvh; }
    }
    .title{ text-align:center; font-weight: 800; font-size: 34px; line-height: 1.1; letter-spacing: .2px; margin: 10px 0 18px; }
    .panel{ border:1px solid var(--panel-border); border-radius: 10px; padding: 14px; margin-bottom: 14px; background: var(--panel-bg); }
    .row{ display:flex; gap:12px; flex-wrap: wrap; align-items:flex-end; }
    label{ display:block; font-size: 12px; color:var(--muted); margin-bottom: 6px; }
    input, select, button{ font: inherit; padding: 8px 10px; border:1px solid var(--control-border); border-radius: 8px; background: var(--control-bg); color: var(--text); }
    input[type="number"]{ width: 110px; }
    input[type="date"]{ width: 132px; } /* narrower */
    input[type="time"]{ width: 130px; }
    .field{ display:flex; flex-direction: column; }
    .field.small input, .field.small select { width: 160px; }
    .field.med input, .field.med select { width: 210px; }
    button{ cursor:pointer; border-color: var(--axis-line); }
    button:disabled{ opacity:.6; cursor: not-allowed; }

    .status{ margin-top: 10px; color: var(--muted); font-size: 13px; white-space: normal; }
    .error{ color: var(--danger); }

    .dateAxisScroll{ position: sticky; top: 0; z-index: 3; background: var(--panel-bg); overflow: hidden; border-bottom: 0; }
    .dateAxisScrollInner{ padding: var(--axis-pad); position: relative; }
    .timelineNav{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 2px 0 4px;
      margin-left: calc(var(--aspect-axis-visible-w, var(--aspect-axis-w, 150px)) + var(--axis-pad));
      margin-right: 6px;
      user-select: none;
      min-height: var(--timeline-nav-h);
    }
    .timelineNavGroup{ display:flex; gap: 14px; }
    .timelineNavBtn{
      background: none;
      border: none;
      padding: 0;
      color: var(--axis-line);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }
    .timelineNavBtn:disabled{ opacity: 0.5; cursor: not-allowed; }
    #dateAxisSvg{ will-change: transform; position: relative; z-index: 1; }
    #axisCornerBlock{
      position: absolute;
      left: var(--axis-pad);
      top: var(--axis-pad);
      width: calc(var(--aspect-axis-visible-w, var(--aspect-axis-w, 150px)) - 1px);
      height: calc(var(--date-axis-h, 80px) + var(--timeline-nav-total, 0px));
      background: var(--panel-bg);
      z-index: 2;
      pointer-events: none;
      display: none;
    }
    .chartFrame{ position: relative; }
    .timelineScroll{ border: 0; border-radius: 0; padding: var(--chart-pad); background: var(--panel-bg); overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; }
    svg{ display:block; width: 100%; }
    #aspectAxisWrap{
      position: absolute;
      left: var(--chart-pad);
      top: var(--chart-pad);
      z-index: 2;
      overflow: hidden;
      width: var(--aspect-axis-visible-w, var(--aspect-axis-w, 150px));
      pointer-events: none;
    }
    #aspectAxisSvg{
      display: block;
      transform: translateX(var(--aspect-axis-shift, 0px));
    }
    #aspectAxisSvg text,
    #dateAxisSvg text{ font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", "Symbola", system-ui, sans-serif; }
    .checks{ display:flex; gap: 14px; align-items:center; flex-wrap: wrap; padding: 6px 0 2px 0; }
    .checks label{ margin: 0; font-size: 13px; color: var(--text); display:flex; gap: 8px; align-items:center; }
    .checks input[type="checkbox"]{ width: 16px; height: 16px; accent-color: var(--axis-line); }
    .optionsRow{ margin-top: 10px; }
    .rowPlanets{ margin-top: 10px; }
    #topChecks{ margin-top: 10px; }
    .aspectDropdown{ position: relative; }
    .aspectDropdown > summary{
      list-style: none;
      cursor: pointer;
      padding: 6px 10px;
      border: 1px solid var(--axis-line);
      border-radius: 8px;
      background: var(--control-bg);
      font-size: 13px;
      color: var(--text);
      user-select: none;
    }
    .aspectDropdown > summary::-webkit-details-marker{ display: none; }
    .aspectDropdown[open] > summary{ background: var(--axis-line); color: var(--accent-contrast); }
    .aspectDropdown .aspectPanel{
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      padding: 10px;
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--panel-bg);
      box-shadow: var(--shadow);
      min-width: 220px;
      z-index: 20;
    }

    .inlineHint{ font-size: 12px; color: var(--muted); margin-left: 2px; margin-right: 2px; }
    .chartLinks{ display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .chartPrivacy{ margin-top: 8px; font-size: 12px; color: var(--muted); }
    .inlineDot{ color: var(--muted); margin: 0; }
    [data-advanced][hidden]{ display: none; }

    
    .orbField input{ width: 70px !important; }
    .orbInline{ display:flex; align-items:center; gap: 8px; }
    .orbInline label{ margin: 0; font-size: 12px; color: var(--muted); }
    .rxField{ align-self: flex-end; }
    .rxField label{ visibility: hidden; height: 0; margin: 0; }
    .smallBtn{ padding: 6px 10px; font-size: 13px; border-radius: 8px; }

    
    .typeahead{ position: relative; }
    .suggestBox{
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--panel-bg);
      border: 1px solid var(--control-border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      max-height: 260px;
      overflow: auto;
      z-index: 30;
    }
    .suggestItem{ padding: 10px 12px; cursor: pointer; }
    .suggestItem:hover{ background: var(--hover); }
    .suggestTitle{ font-size: 14px; }
    .suggestSub{ font-size: 12px; color: var(--muted); margin-top: 2px; }
    .rowTop{ align-items: flex-end; }
    .tinyHelp{ font-size: 12px; color: var(--muted); margin-top: 6px; }
    
    .chartSummary{
      font-size: 13px;
      color: var(--muted);
      padding: 6px 0 0 0;
      line-height: 1.35;
      white-space: pre-line;
    }
    .symbolGlyphText{
      font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", "Symbola", system-ui, sans-serif;
      font-size: 14px;
    }
    .composeHint{
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .composeStopRow{
      margin-top: 4px;
      display: flex;
      justify-content: flex-start;
    }
    .btnSmallPrimary{
      background: var(--axis-line);
      color: var(--accent-contrast);
      border: 1px solid var(--axis-line);
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 8px;
    }
    .btnSmallPrimary:hover{ opacity: .92; }

    .btnGhost{
      background: var(--control-bg);
      border: 1px solid var(--axis-line);
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
    }

    .statusRow{ display:flex; align-items:center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .statusRow .status{ margin-top: 0; }
    .linkBtn{
      background: none;
      border: none;
      padding: 0;
      color: var(--axis-line);
      cursor: pointer;
      text-decoration: underline;
      font-size: 13px;
    }
    .linkBtn:hover{ opacity: .75; }

    @media (max-width: 520px){
      :root{ --chart-pad: 0px; --axis-pad: 0px; }
      .dateAxisScroll{ border-bottom: 0; width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
      .dateAxisScrollInner{ padding: 0; }
      .chartFrame{ width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
      .timelineScroll{ padding: 0; border-radius: 0; width: 100%; margin: 0; }
      #axisCornerBlock{ display: block; }
      .timelineNavGroup:last-child .timelineNavBtn:last-child{ margin-right: 10px; }
      .rowPlanets{ margin-top: 0 !important; }
      .rowPlanets{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
      .rowPlanets .field:nth-child(3){ grid-column: 1 / -1; }
      .rowPlanets .field select{ width: 100%; }
    }

    .chartButtons{ display:flex; gap: 8px; flex-wrap: wrap; }
    .chartBtn{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--axis-line);
      background: var(--control-bg);
      font-size: 13px;
      cursor: pointer;
    }
    .chartBtn.active{
      background: var(--axis-line);
      color: var(--accent-contrast);
    }
    .chartBtn.add{
      border-style: dashed;
    }
    .chartPickers{ display: flex; flex-direction: column; gap: 10px; }
    .chartPickerLabel{ font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .appModeLinks{ display:flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 10px; justify-content: center; }
    .appModeLink{ text-decoration: underline; font-size: 15px; }
    .appModeLink.active{ text-decoration: none; font-weight: 700; }

    .presetButtons{ display:flex; gap: 8px; flex-wrap: wrap; }
    .presetBtn{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--axis-line);
      background: var(--control-bg);
      font-size: 13px;
      cursor: pointer;
    }
    .presetBtn.active{
      background: var(--axis-line);
      color: var(--accent-contrast);
    }

    #tooltip{
      position: fixed; z-index: 9999; left: 0; top: 0; display: none; pointer-events: none;
      padding: 8px 10px; border-radius: 10px; background: var(--panel-bg); color: var(--text);
      border: 1px solid var(--panel-border);
      font-size: 14px; line-height: 1.25; width: 90vw; max-width: 560px; box-shadow: 0 14px 30px rgba(0,0,0,0.55);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      white-space: normal; visibility: hidden;
    }
    #tooltipBackdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9998;
      display: none;
    }
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      #tooltipBackdrop{
        background: rgba(0,0,0,0);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
    }
    #tooltip.popup{
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }
    #tooltip .tooltipClose{
      position: absolute;
      right: 10px;
      top: 8px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
    }
    #tooltip .desc{ opacity: 0.95; margin-top: 6px; }
    #tooltip .sub{ opacity: 0.85; margin-top: 4px; white-space: normal; }
    #tooltip .myth{ opacity: 0.9; margin-top: 6px; font-style: italic; }
    #tooltip .mythToggle{
      margin-top: 6px;
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    #tooltip .tooltipCalendarBlock{
      margin-top: 12px;
    }
    #tooltip .tooltipActions{
      font-size: 13px;
      line-height: 1.4;
      display: block;
    }
    #tooltip .tooltipActionsLabel{ margin-right: 0; }
    #tooltip .tooltipActionsSep{
      opacity: 0.75;
      margin: 0;
    }
    #tooltip .tooltipAction{
      color: var(--text);
      text-decoration: underline;
      font-size: 13px;
      display: inline-block;
      padding: 6px 4px;
      border-radius: 6px;
      margin: 2px 0;
    }
    #tooltip .tooltipAction:active{ background: var(--hover); }
    @media (hover: none) and (pointer: coarse){
      #tooltip .tooltipAction{
        padding: 8px 10px;
      }
    }
    .bar{ cursor: pointer; }
    .installHint{
      margin: 18px 0 22px;
      padding: 10px 12px;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      background: var(--panel-bg);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    .installHintTitle{
      color: var(--text);
      font-weight: 600;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="appModeLinks" role="listbox" aria-label="Mode">
    <button id="appModeChartsBtn" type="button" class="linkBtn appModeLink active" aria-selected="true">Charts</button>
    <span class="inlineDot" aria-hidden="true">•</span>
    <button id="appModeWorldBtn" type="button" class="linkBtn appModeLink" aria-selected="false">World</button>
  </div>

  <div class="panel" id="chartsPanel">
    <div id="chartsSection">
    <div class="row rowTop">
      <div class="field med" style="min-width: 260px; flex: 1;">
        <label>Chart</label>
        <div class="chartPickers">
          <div class="chartPicker">
            <div id="chartButtons" class="chartButtons" role="listbox" aria-label="Chart A"></div>
            <div class="chartLinks" id="chartLinks">
              <button id="chartSummaryToggle" type="button" class="linkBtn" aria-expanded="false">Show data</button>
              <span class="inlineDot" id="composeDot">·</span>
              <button id="composeToggle" type="button" class="linkBtn" aria-expanded="false">Compose</button>
              <span class="inlineDot" id="deleteDot">·</span>
              <button id="deleteChartBtn" type="button" class="linkBtn" title="Delete chart" aria-label="Delete chart">Delete</button>
            </div>
            <div id="chartPrivacy" class="chartPrivacy" hidden>Your data is private (stored locally).</div>
          </div>
          <div class="chartPicker" id="chartPickerB" hidden>
            <div class="chartPickerLabel">Compose with</div>
            <div id="chartButtonsB" class="chartButtons" role="listbox" aria-label="Chart B"></div>
          </div>
          <div id="composeHint" class="composeHint" hidden></div>
          <div id="composeStopRow" class="composeStopRow" hidden>
            <button id="composeStopBtn" type="button" class="linkBtn">Stop composing</button>
          </div>
        </div>
      </div>
    </div>
    <div id="chartSummary" class="chartSummary" hidden></div>

    <div id="addChartPanel" class="row rowTop" style="margin-top:10px; display:none;">
      <div class="field med"><label>Name</label><input id="addChartName" type="text" placeholder="Name" /></div>
      <div class="field med"><label>Birth date</label><input id="addChartBirthDate" type="date" value="1990-09-01" /></div>
      <div class="field med"><label>Birth time (local)</label><input id="addChartBirthTime" type="time" value="18:11" step="60" /></div>

      <div class="field med typeahead">
        <label>Birth place</label>
        <input id="placeSearch" type="text" placeholder="City, country" autocomplete="off" />
        <div id="placeSuggest" class="suggestBox" hidden></div>
      </div>

      <div class="field small"><label>&nbsp;</label><button id="saveChartBtn" type="button" class="btnSmallPrimary">Save</button></div>
      <div class="field small"><label>&nbsp;</label><button id="cancelAddBtn" type="button" class="btnGhost">Cancel</button></div>
    </div>
    </div>
  </div>

<div id="mainContent">
  <div class="panel">
    <div class="row">
      <div class="field med">
        <label>Preset</label>
        <div id="presetButtons" class="presetButtons" role="listbox" aria-label="Preset"></div>
      </div>
    </div>

    <div style="margin-top: 10px;">
      <button id="advancedToggle" type="button" class="linkBtn" aria-expanded="false">Show options</button>
    </div>

    <div class="row optionsRow" data-advanced>
      <div class="field"><label>Start</label><input id="rangeStart" type="date" value="2025-10-01" /></div>
      <div class="field"><label>End</label><input id="rangeEnd" type="date" value="2026-12-31" /></div>
      <div class="field rxField">
        <label>&nbsp;</label>
        <div class="checks" style="padding:0;">
          <label><input id="includeRxGaps" type="checkbox" checked /> Bridge retrograde gaps</label>
        </div>
      </div>
    </div>

    <div class="row rowPlanets" data-advanced>
      <div class="field med"><label>Planets</label><select id="transitGroup"></select></div>
      <div class="field med" id="natalGroupField"><label>Natal targets</label><select id="natalGroup"></select></div>
      <div class="field">
        <div class="checks" style="padding:0;">
          <label><input id="includeMoon" type="checkbox" checked /> Transiting Moon</label>
          <label><input id="includeChiron" type="checkbox" /> Chiron</label>
          <label id="includeMCWrap"><input id="includeMC" type="checkbox" checked /> Mc</label>
        </div>
      </div>
    </div>

    <div class="checks" id="topChecks" data-advanced>
      <details class="aspectDropdown" data-advanced>
        <summary>Aspects</summary>
        <div class="aspectPanel" data-advanced>
          <div class="checks" id="aspectChecks" style="padding:0; gap:12px;"></div>
          <div class="orbInline orbField" style="margin-top: 8px;">
            <label for="orb">Orb (°)</label>
            <input id="orb" type="number" value="1.0" step="0.1" />
          </div>
        </div>
      </details>
    </div>

    <div class="statusRow" data-advanced>
      <button id="updateBtn" type="button" class="linkBtn" style="display:none;">Cancel</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="dateAxisScroll" id="dateAxisScroll">
    <div class="dateAxisScrollInner">
      <div class="timelineNav" data-advanced>
        <div class="timelineNavGroup">
          <button class="timelineNavBtn" id="rangeShiftBack" type="button" aria-label="Shift range backward" title="Shift backward">‹</button>
          <button class="timelineNavBtn" id="rangeExpandBack" type="button" aria-label="Extend range backward" title="Extend backward">«</button>
        </div>
        <div class="timelineNavGroup">
          <button class="timelineNavBtn" id="rangeExpandForward" type="button" aria-label="Extend range forward" title="Extend forward">»</button>
          <button class="timelineNavBtn" id="rangeShiftForward" type="button" aria-label="Shift range forward" title="Shift forward">›</button>
        </div>
      </div>
      <svg id="dateAxisSvg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-label="Date axis"></svg>
      <div id="axisCornerBlock" aria-hidden="true"></div>
    </div>
  </div>
  <div class="chartFrame">
    <div id="aspectAxisWrap">
      <svg id="aspectAxisSvg" width="160" height="280" viewBox="0 0 160 280" role="img" aria-label="Aspect axis"></svg>
    </div>
    <div class="timelineScroll" id="timelineScroll">
      <svg id="timelineSvg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Transit timeline"></svg>
    </div>
    <div id="moreWrap" style="margin-top: 8px; display: none; padding-left: 245px;">
      <button id="showMoreBtn" class="linkBtn" type="button">Show 50 more</button>
    </div>
  </div>
  </div>
  <div id="installHint" class="installHint" hidden>
    <div class="installHintTitle">Add this app to your home screen</div>
    <div id="installHintText"></div>
  </div>
  <div id="tooltipBackdrop" aria-hidden="true"></div>
  <div id="tooltip" aria-hidden="true"></div>

  <script type="module">
    import * as ephNS from "https://esm.sh/ephemeris-astronomy@0.1.1";
    import { awsApiKey } from "./api-key.js";
    const ephemerisAstronomy = ephNS.default ?? ephNS;

    const defaultPresetKey = "week";

    const planets = [
      ["sun","Sun"], ["moon","Moon"], ["mercury","Mercury"], ["venus","Venus"], ["mars","Mars"],
      ["jupiter","Jupiter"], ["saturn","Saturn"], ["uranus","Uranus"], ["neptune","Neptune"], ["pluto","Pluto"],
      ["chiron","Chiron"],
      ["mc","Mc"],
    ];
    const planetSymbols = {
      sun: "☉",
      moon: "☾",
      mercury: "☿",
      venus: "♀",
      mars: "♂",
      jupiter: "♃",
      saturn: "♄",
      uranus: "♅",
      neptune: "♆",
      pluto: "♇",

    function renderFromCache(limit){
      if (!cachedResults){
        updateShowMore(0, 0);
        return;
      }
      const layout = computeTimelineLayout(el.timelineSvg, false);
      currentLayout = layout;
      const threshold = Math.max(0, layout.labelWMax - layout.labelWMin);
      labelsUseSymbols = !!el.timelineScroll && el.timelineScroll.scrollLeft >= threshold;
      const total = cachedResults.rules.length;
      const shown = Math.min(total, Math.max(0, Math.floor(Number(limit || 0))));
      const rules = cachedResults.rules.slice(0, shown);
      const intervals = cachedResults.intervals.slice(0, shown);

      const spanMs = cachedResults.endExclusive.getTime() - cachedResults.start.getTime();
      const showYear = (spanMs / (365.25 * 24 * 3600 * 1000)) >= 3;

      renderAxisSVG({
        svg: el.dateAxisSvg,
        start: cachedResults.start,
        endExclusive: cachedResults.endExclusive,
        stepMillis: cachedResults.stepMillis,
        layout
      });

      renderLabelsSVG({
        svg: el.aspectAxisSvg,
        rules,
        chartRuler: cachedResults.chartRuler,
        layout,
        useSymbols: labelsUseSymbols
      });

      renderTimelineSVG({
        svg: el.timelineSvg,
        start: cachedResults.start,
        endExclusive: cachedResults.endExclusive,
        rules,
        intervalsByRule: intervals,
        stepMillis: cachedResults.stepMillis,
        presetKey: cachedResults.presetKey,
        chartRuler: cachedResults.chartRuler,
        layout,
        showYear
      });

      updateShowMore(shown, total);
      updateAxisTransform();
    }

    function updateAxisTransform(){
      if (!el.dateAxisSvg || !el.timelineScroll) return;
      const scrollLeft = el.timelineScroll.scrollLeft;
      const layout = currentLayout;
      const labelWMax = layout?.labelWMax ?? 150;
      const labelWMin = layout?.labelWMin ?? 96;
      const shift = Math.min(Math.max(0, scrollLeft), Math.max(0, labelWMax - labelWMin));
      el.dateAxisSvg.style.transform = `translate3d(${-Math.round(scrollLeft)}px, 0, 0)`;
      document.documentElement.style.setProperty("--aspect-axis-visible-w", `${labelWMax - shift}px`);
      document.documentElement.style.setProperty("--aspect-axis-shift", `${-Math.round(shift)}px`);
      updateLabelsMode();
    }

    function symbolsThreshold(){
      const layout = currentLayout;
      if (!layout) return 4;
      return Math.max(0, layout.labelWMax - layout.labelWMin);
    }

    function updateLabelsMode(){
      if (!cachedResults || !el.timelineScroll) return;
      const shouldUseSymbols = el.timelineScroll.scrollLeft >= symbolsThreshold();
      if (shouldUseSymbols === labelsUseSymbols) return;
      labelsUseSymbols = shouldUseSymbols;
      renderFromCache(currentMaxRows);

    function rangeSpanDays(){
      const start = parseLocalDateOnly(el.rangeStart.value);
      const end = parseLocalDateOnly(el.rangeEnd.value);
      const endExclusive = addDaysLocal(end, 1);
      return Math.max(1, Math.round((endExclusive.getTime() - start.getTime()) / (24 * 3600 * 1000)));
    }

    function setRangeDates(start, end){

    function shiftRange(direction){
      const start = parseLocalDateOnly(el.rangeStart.value);
      const end = parseLocalDateOnly(el.rangeEnd.value);
      const delta = rangeSpanDays() * direction;
      setRangeDates(addDaysLocal(start, delta), addDaysLocal(end, delta));
    }

    function expandRange(direction){
      const start = parseLocalDateOnly(el.rangeStart.value);
      const end = parseLocalDateOnly(el.rangeEnd.value);
      const delta = rangeSpanDays() * direction;
      if (direction < 0){
        setRangeDates(addDaysLocal(start, delta), end);
      } else {
        setRangeDates(start, addDaysLocal(end, delta));
      }
    }

      const pa = String(a || "");

      const ia = orderMap.has(pa) ? orderMap.get(pa) : Number.MAX_SAFE_INTEGER;
      const ib = orderMap.has(pb) ? orderMap.get(pb) : Number.MAX_SAFE_INTEGER;
      const [first, second] = (ia === ib) ? [pa, pb] : (ia < ib ? [pa, pb] : [pb, pa]);
      return `${first}-aspect-${second}`;
    }

    function addDaysLocal(dateObj, days){
      const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());

    function parseLocalDateOnly(yyyyMmDd){

      return new Date(y, m-1, d, 0, 0, 0, 0);
    }
    function fmtLocalYYYYMMDD(dateObj){
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth()+1).padStart(2,"0");
      const day = String(dateObj.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    }

    const signSymbols = ["♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"];
    const summaryPlanetOrder = ["sun","moon","mercury","venus","mars","jupiter","saturn","uranus","neptune","pluto"];
    const summaryPointSymbols = { asc: "Ac", mc: "Mc" };

    function zodiacSignSymbol(deg){
      const idx = Math.floor(wrap360(deg) / 30) % 12;
      return signSymbols[idx] || "";
    }

    function buildSymbolPlacementsLine(lonByKey){
      const pieces = [];
      for (const k of summaryPlanetOrder){
        const lon = lonByKey?.[k];
        if (!Number.isFinite(lon)) continue;
        const planetGlyph = planetSymbols[k];
        if (!planetGlyph) continue;
        pieces.push(`${planetGlyph}\u00A0${zodiacSignSymbol(lon)}`);
      }
      if (Number.isFinite(lonByKey?.asc)){
        pieces.push(`${summaryPointSymbols.asc}\u00A0${zodiacSignSymbol(lonByKey.asc)}`);
      }
      if (Number.isFinite(lonByKey?.mc)){
        pieces.push(`${summaryPointSymbols.mc}\u00A0${zodiacSignSymbol(lonByKey.mc)}`);
      }
      return pieces.join(" • ");
    }

    function buildChartSummaryText(pA, pB, { includePlacementsLine=false } = {}){
      if (chartsState.addMode) return "Add a new chart.";
      if (!pA) return "";
      if (appMode !== "charts") return "";
      if (chartsState.mode === "composite" && !pB) return "Pick two charts to build a composite.";
      const parts = [];
      let placementsLine = "";
      try{
        if (ephemerisAstronomy && typeof ephemerisAstronomy.getAllPlanets === "function"){
          if (chartsState.mode === "composite"){
            if (!pB) throw new Error("Select two charts.");
            const composite = computeCompositeChart(pA, pB);
            parts.push(`Composite of ${pA.name} & ${pB.name}`);
            if (includePlacementsLine){
              placementsLine = buildSymbolPlacementsLine({
                ...composite.lon,
                asc: composite.asc,
                mc: composite.mc
              });
            }
          } else {
            const birthUTC = parseBirthUTCFor(pA);
            const allPlanets = ephemerisAstronomy.getAllPlanets(birthUTC, pA.lon, pA.lat, 0);
            if (includePlacementsLine){
              const lonByKey = {};
              for (const key of summaryPlanetOrder){
                lonByKey[key] = getPlanetLonFromAll(allPlanets, key);
              }
              lonByKey.asc = calcNatalAscDeg(birthUTC, pA.lon, pA.lat);
              lonByKey.mc = calcNatalMCDeg(birthUTC, pA.lon);
              placementsLine = buildSymbolPlacementsLine(lonByKey);
            }
          }
        }
      } catch {}
      if (chartsState.mode !== "composite"){
        parts.push(`${pA.birthDate} ${pA.birthTime}`);
        if (pA.placeLabel) parts.push(pA.placeLabel);
        const cc = fmtCoord(pA.lat, pA.lon);
        if (cc) parts.push(cc);
      }
      const firstLine = parts.join(" • ");
      if (includePlacementsLine && placementsLine){
        return firstLine ? `${firstLine}\n${placementsLine}` : placementsLine;
      }
      return firstLine;
    }

    // Angular helpers
    function wrap360(deg){ let x = deg % 360; if (x < 0) x += 360; return x; }
    function midpointAngle(a, b){
      const diff = wrap360(b - a);
      const adj = diff > 180 ? diff - 360 : diff;
      return wrap360(a + adj / 2);
    }
    function angDist(a,b){ const d = Math.abs(wrap360(a - b)); return d > 180 ? 360 - d : d; }
    function degToRad(d){ return d * Math.PI / 180; }
    function radToDeg(r){ return r * 180 / Math.PI; }

    }

    // --- Time zone helpers (local time in tzName -> UTC) ---
    function tzOffsetMinutesAt(utcDate, tzName){
      const dtf = new Intl.DateTimeFormat("en-US", {
        timeZone: tzName,
        hour12: false,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
      const parts = dtf.formatToParts(utcDate).filter(p => p.type !== "literal");
      const map = {};
      for (const p of parts) map[p.type] = p.value;
      const asUTC = Date.UTC(+map.year, +map.month - 1, +map.day, +map.hour, +map.minute, +map.second);
      return (asUTC - utcDate.getTime()) / 60000;
    }

    function utcFromLocalPartsInTZ(y, m, d, hh, mm, tzName){
      const localAsUTC = Date.UTC(y, m-1, d, hh, mm, 0, 0);
      let off0 = tzOffsetMinutesAt(new Date(localAsUTC), tzName);
      let utcMillis = localAsUTC - off0 * 60000;
      let off1 = tzOffsetMinutesAt(new Date(utcMillis), tzName);
      if (off1 !== off0){
        utcMillis = localAsUTC - off1 * 60000;
      }
      return new Date(utcMillis);
    }


    function parseBirthUTCFor(p){
      if (!p) throw new Error("Pick a chart first.");
      const dateStr = p.birthDate;
      const timeStr = p.birthTime || "00:00";
      const [y,m,d] = dateStr.split("-").map(Number);
      const [hh,mm] = timeStr.split(":").map(Number);

      if (p.tzName){
        return utcFromLocalPartsInTZ(y, m, d, hh, mm, p.tzName);
      }
      const tz = Number(p.tzOffset || 0);
      const utcMillis = Date.UTC(y, m-1, d, hh - tz, mm, 0, 0);
      return new Date(utcMillis);
    }

    // MC calculation (mean sidereal time + mean obliquity)
    function julianDay(dateObj){ return (dateObj.getTime() / 86400000) + 2440587.5; }
    function meanObliquityDeg(t){
      const sec = 21.448 - 46.8150*t - 0.00059*t*t + 0.001813*t*t*t;
      return 23 + (26/60) + (sec/3600);
    }
    function gmstDeg(jd){
      const t = (jd - 2451545.0) / 36525.0;
      let gmst = 280.46061837
        + 360.98564736629 * (jd - 2451545.0)
        + 0.000387933 * t*t
        - (t*t*t) / 38710000.0;
      return wrap360(gmst);
    }
    function calcNatalMCDeg(birthUTC, lonDeg){
      const jd = julianDay(birthUTC);
      const t = (jd - 2451545.0) / 36525.0;
      const eps = degToRad(meanObliquityDeg(t));
      const lst = degToRad(wrap360(gmstDeg(jd) + lonDeg)); // east-positive
      const lam = Math.atan2(Math.sin(lst) * Math.cos(eps), Math.cos(lst));
      return wrap360(radToDeg(lam));
    }

    function calcNatalAscDeg(birthUTC, lonDeg, latDeg){
      const jd = julianDay(birthUTC);
      const t = (jd - 2451545.0) / 36525.0;
      const eps = degToRad(meanObliquityDeg(t));
      const lst = degToRad(wrap360(gmstDeg(jd) + lonDeg)); // east-positive
      const phi = degToRad(latDeg);

      // Ascendant (ecliptic longitude rising) - standard formula
      const ascRad = Math.atan2(
        -Math.cos(lst),
        (Math.sin(lst) * Math.cos(eps)) + (Math.tan(phi) * Math.sin(eps))
      ) + Math.PI;

      return wrap360(radToDeg(ascRad));
    }

    function chartRulerFromAsc(ascDeg){
      const sign = Math.floor(wrap360(ascDeg) / 30); // 0=Aries..11=Pisces
      const rulers = ["mars","venus","mercury","moon","sun","mercury","venus","mars","jupiter","saturn","saturn","jupiter"]; // traditional
      return rulers[sign] || null;
    }

    function computeCompositeChart(pA, pB){
      const birthUTCA = parseBirthUTCFor(pA);
      const birthUTCB = parseBirthUTCFor(pB);
      const allA = ephemerisAstronomy.getAllPlanets(birthUTCA, pA.lon, pA.lat, 0);
      const allB = ephemerisAstronomy.getAllPlanets(birthUTCB, pB.lon, pB.lat, 0);
      const lon = {};
      for (const k of order){
        if (k === "mc") continue;
        lon[k] = midpointAngle(getPlanetLonFromAll(allA, k), getPlanetLonFromAll(allB, k));
      }
      const mcA = calcNatalMCDeg(birthUTCA, pA.lon);
      const mcB = calcNatalMCDeg(birthUTCB, pB.lon);
      lon.mc = midpointAngle(mcA, mcB);
      const ascA = calcNatalAscDeg(birthUTCA, pA.lon, pA.lat);
      const ascB = calcNatalAscDeg(birthUTCB, pB.lon, pB.lat);
      const asc = midpointAngle(ascA, ascB);
      const compLon = midpointAngle(pA.lon, pB.lon);
      const compLat = (Number.isFinite(pA.lat) && Number.isFinite(pB.lat)) ? ((pA.lat + pB.lat) / 2) : (Number(pA.lat) || 0);
      return { lon, asc, mc: lon.mc, location: { lon: compLon, lat: compLat } };
    }

    function groupByKey(list){
      const m = new Map();
      for (const [key, label, arr] of list) m.set(key, arr);
      return m;
    }
    const transitGroupMap = groupByKey(transitGroups);
    const natalGroupMap = groupByKey(natalGroups);

    function uniquePush(arr, v){ if (!arr.includes(v)) arr.push(v); }

    function buildCandidateRules(){
      let transitPlanets = [...(transitGroupMap.get($("transitGroup").value) ?? transitGroupMap.get("outer") ?? [])];
      const natalTargets = [...(natalGroupMap.get($("natalGroup").value) ?? natalGroupMap.get("classical") ?? [])];

      if (el.includeChiron.checked){
        uniquePush(transitPlanets, "chiron");
        uniquePush(natalTargets, "chiron");
      }
      if (el.includeMC.checked){
        uniquePush(natalTargets, "mc");
      }
      if (!el.includeMoon.checked){
        transitPlanets = transitPlanets.filter(p => p !== "moon");
      }

      const aspects = getCheckedAspects();
      const orb = Number($("orb").value || 1.0);

      const rules = [];
      for (const tp of transitPlanets){
        for (const np of natalTargets){
          for (const asp of aspects){
            rules.push({ transit: tp, natal: np, aspect: asp, orb });
          }
        }
      }
      return rules;
    }

    function buildSkyRules(){
      let skyPlanets = [...(transitGroupMap.get($("transitGroup").value) ?? transitGroupMap.get("outer") ?? [])];
      if (el.includeChiron.checked){
        uniquePush(skyPlanets, "chiron");
      }
      if (!el.includeMoon.checked){
        skyPlanets = skyPlanets.filter(p => p !== "moon");
      }
      skyPlanets = skyPlanets.filter(p => p !== "mc");
      const aspects = getCheckedAspects();
      const orb = Number($("orb").value || 1.0);
      const rules = [];
      for (let i=0; i<skyPlanets.length; i++){
        for (let j=i+1; j<skyPlanets.length; j++){
          for (const asp of aspects){
            rules.push({ transit: skyPlanets[i], aspect: asp, natal: skyPlanets[j], orb });
          }
        }
      }
      return rules;
    }

    function groupActiveIntervalsWithExact(flagsIn, deltasIn, sampleTimes, endExclusive, bridgeTinyGaps){
      const intervals = [];
      if (!sampleTimes.length) return intervals;

      const flags = flagsIn.slice();
      const deltas = deltasIn.slice();
      if (bridgeTinyGaps){
        for (let i=1; i<flags.length-1; i++){
          if (!flags[i] && flags[i-1] && flags[i+1]){
            flags[i] = true;
            deltas[i] = Math.min(deltas[i-1], deltas[i+1]);
          }
        }
      }

      let inRun = false;
      let runStart = null;
      let minDelta = Infinity;
      let exactTime = null;
      let lastActiveSample = null;
      let runClippedStart = false;
      for (let i=0; i<flags.length; i++){
        const active = flags[i];
        if (active){
          if (!inRun){
            inRun = true;
            runStart = sampleTimes[i];
            minDelta = deltas[i];
            exactTime = sampleTimes[i];
            lastActiveSample = sampleTimes[i];
            runClippedStart = (i === 0);
          } else if (deltas[i] < minDelta){
            minDelta = deltas[i];
            exactTime = sampleTimes[i];
          }
          lastActiveSample = sampleTimes[i];
        } else if (inRun){
          inRun = false;
          const exactAtBoundary = runClippedStart && exactTime && exactTime.getTime() === runStart.getTime();
          intervals.push([runStart, sampleTimes[i], exactTime, exactAtBoundary]);
          runStart = null;
          minDelta = Infinity;
          exactTime = null;
          lastActiveSample = null;
          runClippedStart = false;
        }
      }
      if (inRun){
        const exactAtBoundary = runClippedStart
          ? (exactTime && exactTime.getTime() === runStart.getTime())
          : (exactTime && lastActiveSample && exactTime.getTime() === lastActiveSample.getTime());

    function refineExactMinute(approx, rangeStart, rangeEnd, stepMillis, rule){
      if (!approx || !cachedObserver) return approx;
      const lo = Math.min(rangeStart.getTime(), rangeEnd.getTime());
      const hi = Math.max(rangeStart.getTime(), rangeEnd.getTime());
      if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi < lo) return approx;

      let a = lo;
      let b = hi;
      let bestT = approx.getTime();
      let bestD = aspectDeltaAt(new Date(bestT), rule, cachedObserver);
      if (bestD === null) return approx;

      // Deterministic bracketed search to reduce expensive ephemeris evaluations.
      for (let i=0; i<22 && (b - a) > (2 * 60000); i++){
        const t1 = Math.floor(a + (b - a) / 3);
        const t2 = Math.floor(b - (b - a) / 3);
        const d1 = aspectDeltaAt(new Date(t1), rule, cachedObserver);
        const d2 = aspectDeltaAt(new Date(t2), rule, cachedObserver);
        if (d1 !== null && d1 < bestD){ bestD = d1; bestT = t1; }
        if (d2 !== null && d2 < bestD){ bestD = d2; bestT = t2; }
        if (d1 === null || d2 === null) break;
        if (d1 <= d2){
          b = t2;
        } else {
          a = t1;
        }
      }

      const fineLo = Math.max(lo, Math.floor(a / 60000) * 60000);
      const fineHi = Math.min(hi, Math.ceil(b / 60000) * 60000);
      for (let t = fineLo; t <= fineHi; t += 60000){
        const d = aspectDeltaAt(new Date(t), rule, cachedObserver);
        if (d === null) continue;
        if (d < bestD){
          bestD = d;
          bestT = t;
        }
      }

      // Final local refinement to lock onto the closest minute as accurately as possible.
      const secLo = Math.max(lo, bestT - 60000);
      const secHi = Math.min(hi, bestT + 60000);
      for (let t = secLo; t <= secHi; t += 10000){
        const d = aspectDeltaAt(new Date(t), rule, cachedObserver);
        if (d === null) continue;
        if (d < bestD){
          bestD = d;
          bestT = t;
        }
      }

      return new Date(Math.round(bestT / 60000) * 60000);
    }

      const spanMs = Math.max(1, endMs - startMs);
      const spanDays = spanMs / (24*3600*1000);
      const dateToX = (d) => x0 + ((d.getTime() - startMs) / spanMs) * timelineW;
      const topLabelByMs = new Set();

      svg.appendChild(svgEl("rect", {x:x0, y:axisY, width:timelineW, height:40, fill:"var(--axis-bg)"}));
      svg.appendChild(svgEl("line", {x1:x0, y1:axisY + 40, x2:x0 + timelineW, y2:axisY + 40, stroke:"var(--axis-line)", "stroke-width":"1.5"}));

      const axisLabelSize = isCompact ? 15 : 18;
      const axisTitleSize = isCompact ? 16 : 20;
      const minBoxPx = axisLabelSize * 2.7;
      const minLabelPx = axisLabelSize * 2.2;
      const monthLabelPx = axisLabelSize * 1.6;

      const useHours = (spanDays <= 2 && stepMillis < 24*3600*1000);
      const useDays  = (!useHours) && (spanDays <= 45);

      const boundaries = (() => {
        if (useHours){
          const totalHours = spanMs / (3600 * 1000);
          const stepHours = pickStep(totalHours, timelineW, minBoxPx, [1,2,3,4,6,8,12,24]);
          return [start, ...getHourStartsLocal(start, endExclusive, stepHours), endExclusive];
        }
        if (useDays){
          const totalDays = spanDays;
          const stepDays = pickStep(totalDays, timelineW, minBoxPx, [1,2,3,4,5,7,10,14,21,30]);
          return [start, ...getDayStartsLocal(start, endExclusive, stepDays), endExclusive];
        }
        const totalMonths = spanDays / 30.44;
        const stepMonths = pickStep(totalMonths, timelineW, minBoxPx, [1,2,3,4,6,12]);
        return [start, ...getMonthStartsLocal(start, endExclusive, stepMonths), endExclusive];
      })();

      if (useHours){
        const dateLabel = start.toLocaleDateString(locale, {month:"short", day:"numeric", year:"numeric"});
        const t = svgEl("text", { x: x0 + 6, y: axisY - 6, "font-size": String(axisTitleSize), "font-weight":"700", fill:"var(--text)" });
        t.textContent = dateLabel;
        svg.appendChild(t);
      }

      if (useDays){
        for (let i=0; i<boundaries.length-1; i++){
          const a = boundaries[i];
          const prev = boundaries[i-1];
          const monthChanged = (!prev) || (prev.getMonth() !== a.getMonth()) || (prev.getFullYear() !== a.getFullYear());
          if (monthChanged) topLabelByMs.add(a.getTime());
        }
      }
      if (!useHours && !useDays){
        const months = getMonthStartsLocal(start, endExclusive);
        for (const m of months){
          if (m.getMonth() === 0) topLabelByMs.add(m.getTime());
        }
      }

      for (let i=0; i<boundaries.length-1; i++){
        const a = boundaries[i];
        const xa = dateToX(a);
        const xb = dateToX(boundaries[i+1]);
        const w = Math.max(0.5, xb - xa);
        const isTopLabeled = topLabelByMs.has(a.getTime());
        const tickY1 = isTopLabeled ? axisY : (axisY + 20);
        svg.appendChild(svgEl("line", {x1:xa, y1:tickY1, x2:xa, y2:axisY + 40, stroke:"var(--axis-line)", "stroke-width":"1"}));

        let label = "";
        let shouldLabel = false;

        if (useHours){
          const hh = a.getHours();
          label = `${String(hh).padStart(2,"0")}:00`;
          shouldLabel = (w >= minLabelPx);
        } else if (useDays){
          const mon = a.toLocaleString(locale, {month:"short"});
          const dow = a.toLocaleString(locale, {weekday:"short"});

          // Don't repeat the month on every tick: show month only at changes.
          const prev = boundaries[i-1];
          const monthChanged = (!prev) || (prev.getMonth() !== a.getMonth()) || (prev.getFullYear() !== a.getFullYear());

          if (spanDays <= 10){
            label = `${dow} ${a.getDate()}`;
          } else {
            label = `${a.getDate()}`;
          }

          shouldLabel = (w >= minLabelPx);
          if (monthChanged){
            const mtX = Math.max(x0 + 6, xa - 6);
            const mt = svgEl("text", { x: mtX, y: axisY - 6, "font-size": String(axisTitleSize), "font-weight":"700", fill:"var(--text)" });
            mt.textContent = mon;
            svg.appendChild(mt);
          }
        } else {
          label = a.toLocaleString(locale, {month:"short"});
          shouldLabel = (w >= monthLabelPx);
        }

        if (shouldLabel){
          const txt = svgEl("text", {x: xa + 6, y: axisY + 25, "font-size": String(axisLabelSize), fill:"var(--text)"});
          txt.textContent = label;
          svg.appendChild(txt);
        }
      }

      if (!useHours && !useDays){
        const months = getMonthStartsLocal(start, endExclusive);
        for (const m of months){
          if (m.getMonth() === 0){
            const yearX = Math.max(x0 + 6, dateToX(m) - 6);
            const t = svgEl("text", { x: yearX, y: axisY - 6, "font-size": String(axisTitleSize), "font-weight":"700", fill:"var(--text)" });
            t.textContent = String(m.getFullYear());
            svg.appendChild(t);
          }
        }
      }
    }

    function renderLabelsSVG({svg, rules, chartRuler, layout, useSymbols=false}){
      if (!svg) return;
      clearSvg(svg);
      const { labelW, rowH, rowGap, bottomPad, isCompact } = layout;
      const n = rules.length;
      const rowsY0 = isCompact ? 6 : 8;
      const totalH = rowsY0 + (n*(rowH+rowGap)) + bottomPad;

      document.documentElement.style.setProperty("--aspect-axis-w", `${labelW}px`);
      svg.setAttribute("viewBox", `0 0 ${labelW} ${totalH}`);
      svg.setAttribute("width", String(labelW));
      svg.setAttribute("height", String(totalH));
      svg.style.width = `${labelW}px`;
      svg.style.height = `${totalH}px`;
      svg.appendChild(svgEl("rect", {x:0, y:0, width: labelW, height: totalH, fill:"var(--axis-bg)"}));

      const labelX = labelW - 8;

      const labelFontSize = isCompact ? 17 : 20;
      for (let idx=0; idx<rules.length; idx++){
        const r = rules[idx];
        const y = rowsY0 + idx*(rowH+rowGap);
        const t = svgEl("text", {
          x: labelX,
          y: y + rowH/2 + 4,
          "font-size": String(labelFontSize),
          fill:"var(--text)",
          "text-anchor":"end"
        });

        const transitLabel = useSymbols ? (planetSymbols[r.transit] || planetLabel(r.transit)) : planetLabel(r.transit);
        const natalLabel = useSymbols ? (planetSymbols[r.natal] || planetLabel(r.natal)) : planetLabel(r.natal);
        const parts = [
          { text: transitLabel + " " },
          { text: aspectSymbol(r.aspect) + " " },
          { text: natalLabel, underline: (!useSymbols && chartRuler && r.natal === chartRuler) }
        ];

        for (const p of parts){
          const sp = document.createElementNS(svgNs, "tspan");
          sp.textContent = p.text;
          if (p.underline) sp.setAttribute("text-decoration", "underline");
          t.appendChild(sp);
        }

        svg.appendChild(t);
      }
    }

    function renderTimelineSVG({svg, start, endExclusive, rules, intervalsByRule, stepMillis, presetKey, chartRuler, layout, showYear}){
      clearSvg(svg);

      const { totalW, timelineW, labelW, marginL, rowH, rowGap, bottomPad, isCompact } = layout;
      const x0 = marginL + labelW;

      const n = rules.length;
      const rowsY0 = isCompact ? 6 : 8;
      const totalH = rowsY0 + (n*(rowH+rowGap)) + bottomPad;

      svg.setAttribute("viewBox", `0 0 ${totalW} ${totalH}`);
      svg.setAttribute("width", String(totalW));
      svg.setAttribute("height", String(totalH));
      svg.style.width = `${totalW}px`;
      svg.style.height = `${totalH}px`;
      svg.appendChild(svgEl("rect", {x:0, y:0, width: totalW, height: totalH, fill:"var(--panel-bg)"}));

      const startMs = start.getTime();
      const endMs = endExclusive.getTime();
      const spanMs = Math.max(1, endMs - startMs);
      const dateToX = (d) => x0 + ((d.getTime() - startMs) / spanMs) * timelineW;

      for (let idx=0; idx<rules.length; idx++){
        const r = rules[idx];
        const y = rowsY0 + idx*(rowH+rowGap);

        svg.appendChild(svgEl("line", {
          x1:x0, y1:y + rowH/2, x2:x0 + timelineW, y2:y + rowH/2,
          stroke:"var(--muted)", "stroke-width":"1", "stroke-dasharray":"2,6"
        }));

        const rowLabel = `${planetLabel(r.transit)} ${aspectSymbol(r.aspect)} ${planetLabel(r.natal)}`;

        const intervals = intervalsByRule[idx] ?? [];
        for (const [a,b,exact,exactAtBoundary] of intervals){
          const xa = dateToX(a);
          const xb = dateToX(b);
          const w = Math.max(1, xb - xa);

          const isReturn = r.aspect === "conjunction" && r.transit === r.natal;
          const barColor = isReturn ? "#d4a017" : (aspectColors[r.aspect] || "var(--text)");
          const rect = svgEl("rect", { x: xa, y: y + 4, width: w, height: rowH - 8, fill: barColor, class: "bar" });

          const showTime = stepMillis < 24*3600*1000;
          const endApprox = new Date(Math.max(a.getTime(), b.getTime() - stepMillis));
          const rangeText = formatRangePretty(a, endApprox, showTime, showYear);
          const descKey = `${r.transit}-${r.aspect}-${r.natal}`;
          const descText = aspectDescriptions[descKey] || "";
          const mythKey = mythKeyFor(r.transit, r.natal);
          const mythText = mythDescriptions[mythKey] || "";
          const glyphTitleCore = `${planetSymbols[r.transit] || planetLabel(r.transit)} ${aspectSymbol(r.aspect)} ${planetSymbols[r.natal] || planetLabel(r.natal)}`;
          const calendarTitle = (appMode === "world") ? `${glyphTitleCore} world` : glyphTitleCore;

          let exactLabelCache = null;
          let refinedExactDateCache = undefined;
          const getRefinedExactDate = () => {
            if (!exact) return null;
            if (refinedExactDateCache !== undefined) return refinedExactDateCache;
            const refineWindowMs = 24 * 3600 * 1000;
            const refineStart = new Date(exact.getTime() - refineWindowMs);
            const refineEnd = new Date(exact.getTime() + refineWindowMs);
            refinedExactDateCache = refineExactMinute(exact, refineStart, refineEnd, stepMillis, r);
            return refinedExactDateCache;
          };
          const getExactLabel = () => {
            if (exactLabelCache !== null) return exactLabelCache;
            if (!exact) return "";
            const refined = getRefinedExactDate();
            exactLabelCache = formatExactPretty(refined, a, endApprox, showYear);
            return exactLabelCache;
          };
          const buildCalendarData = () => ({
            title: calendarTitle,
            segmentStart: a,
            segmentEnd: endApprox,
            exactTime: getRefinedExactDate()
          });
          const bindSegmentTooltipEvents = (target) => {
            target.addEventListener("pointerenter", (e) => {
              if (isCoarsePointer()) return;
              showTooltip(e, rowLabel, descText, rangeText, false, mythText, getExactLabel());
            });
            target.addEventListener("pointermove", (e) => {
              if (tooltip.style.display === "block" && !isCoarsePointer() && !tooltip.classList.contains("popup")){
                moveTooltip(e.clientX, e.clientY);
              }
            });
            target.addEventListener("pointerleave", () => {
              if (isCoarsePointer()) return;
              if (tooltip.classList.contains("popup")) return;
              hideTooltip();
            });
            target.addEventListener("pointerdown", (e) => {
              if (isCoarsePointer()){
                showTooltip(e, rowLabel, descText, rangeText, true, mythText, getExactLabel(), buildCalendarData());
              }
            });
            target.addEventListener("click", (e) => {
              showTooltip(e, rowLabel, descText, rangeText, true, mythText, getExactLabel(), buildCalendarData());
            });
          };

          bindSegmentTooltipEvents(rect);

          svg.appendChild(rect);
          if (exact && !exactAtBoundary && exact >= a && exact <= b){
            const xExact = dateToX(exact);
            if (xExact >= xa && xExact <= xb){
              const cy = y + rowH / 2;
              const hitCircle = svgEl("circle", {
                cx: xExact,
                cy,
                r: 10,
                fill: "transparent",
                class: "bar"
              });
              bindSegmentTooltipEvents(hitCircle);
              svg.appendChild(hitCircle);
              svg.appendChild(svgEl("circle", {
                cx: xExact,
                cy,
                r: 3.5,
                fill: "var(--text)",
                stroke: barColor,
                "stroke-width": "1.5",
                "pointer-events": "none"
              }));
            }
          }
        }
      }

      const now = new Date();
      if (now >= start && now < endExclusive){
        const xNow = dateToX(now);
        const yTop = 0;
        const yBottom = totalH - 10;

        svg.appendChild(svgEl("line", {
          x1: xNow, y1: yTop, x2: xNow, y2: yBottom,
          stroke: "var(--accent)",
          "stroke-width": "1",
          "stroke-dasharray": "4,6",
          opacity: "0.7"
        }));
      }

      svg.addEventListener("pointerleave", () => {
        if (isCoarsePointer()) return;
        if (tooltip.classList.contains("popup")) return;
        hideTooltip();
      });
      ensureTooltipListeners();
    }

    async function updateTimeline(){
      if (isComputing){
        cancelRequested = true;
        pendingUpdate = true;
        return;
      }
      try{
        if (!ephemerisAstronomy || typeof ephemerisAstronomy.getAllPlanets !== "function"){
          throw new Error("Ephemeris library didn't load correctly (no getAllPlanets).");
        }

        isComputing = true;
        cancelRequested = false;
        pendingUpdate = false;
        el.updateBtn.style.display = "inline-block";
        el.updateBtn.disabled = false;
        setStatus("Computing…");

        const chartA = getActiveChartA();
        const chartB = getActiveChartB();
        const isChartsMode = appMode === "charts";
        const isComposite = isChartsMode && chartsState.mode === "composite";
        if (isChartsMode && !chartA) throw new Error("Pick a chart first.");
        if (isComposite && !chartB) throw new Error("Pick two charts for composite.");
        let lon = Number(chartA?.lon || 0);
        let lat = Number(chartA?.lat || 0);
        const height = 0;
        cachedObserver = { lon, lat, height };
        let composite = null;
        if (isComposite){
          composite = computeCompositeChart(chartA, chartB);
          lon = composite.location.lon;
          lat = composite.location.lat;
          cachedObserver = { lon, lat, height };
        }

        currentMaxRows = 50;
        const includeRxGaps = el.includeRxGaps.checked;

        const birthUTC = (isChartsMode && chartA) ? parseBirthUTCFor(chartA) : null;

        const rangeStartLocal = parseLocalDateOnly(el.rangeStart.value);
        const rangeEndLocal = parseLocalDateOnly(el.rangeEnd.value);
        const endExclusive = addDaysLocal(rangeEndLocal, 1);
        if (!(rangeStartLocal < endExclusive)) throw new Error("Timeline end must be after start.");

        const candidateRules = (appMode === "world") ? buildSkyRules() : buildCandidateRules();
        const aspectsChecked = getCheckedAspects();
        if (aspectsChecked.length === 0) throw new Error("Select at least one aspect.");

        const preset = presets.find(p => p.key === activePresetKey) ?? presets[0];
        const rangeDays = (endExclusive.getTime() - rangeStartLocal.getTime()) / (24 * 3600 * 1000);
        const stepDaysBase = preset?.stepDays ?? 1;
        const rangeYears = rangeDays / 365.25;
        const minStepDays = rangeYears > 4 ? 4 : (rangeYears > 2 ? 2 : 1);
        const stepDays = Math.max(minStepDays, stepDaysBase);

        let stepMillis;
        if (rangeDays <= 35){
          stepMillis = 1 * 3600 * 1000;
        } else {
          stepMillis = Math.max(1, Number(stepDays)) * 24 * 3600 * 1000;
        }

        const transitPlanetsAll = (appMode === "world")
          ? Array.from(new Set(candidateRules.flatMap(r => [r.transit, r.natal])))
          : Array.from(new Set(candidateRules.map(r => r.transit)));
        const transitPlanetsFiltered = transitPlanetsAll.filter(p => p !== "mc");
        const planetsKey = transitPlanetsFiltered.slice().sort().join(",");
        const cacheKey = buildTransitCacheKey({ rangeStartLocal, endExclusive, stepMillis, lon, lat, height, planetsKey });
        let sampleTimes;
        let transitLonBySample;

        if (transitCache && transitCache.key === cacheKey){
          sampleTimes = transitCache.sampleTimes;
          transitLonBySample = transitCache.transitLonBySample;
        } else {
          sampleTimes = [];
          for (let t = rangeStartLocal.getTime(); t < endExclusive.getTime(); t += stepMillis){
            sampleTimes.push(new Date(t));
          }
          if (sampleTimes.length === 0) throw new Error("Range too small to sample.");

          transitLonBySample = {};
          for (const p of transitPlanetsFiltered) transitLonBySample[p] = new Array(sampleTimes.length);

          for (let i=0; i<sampleTimes.length; i++){
            if (cancelRequested) throw new Error("Cancelled");
            const d = sampleTimes[i];
            if (i % 120 === 0) await new Promise(r => setTimeout(r, 0));
            const allPlanets = ephemerisAstronomy.getAllPlanets(d, lon, lat, height);
            for (const p of transitPlanetsFiltered){
              transitLonBySample[p][i] = getPlanetLonFromAll(allPlanets, p);
            }
            if (i % 10 === 0 || i === sampleTimes.length - 1){
              setStatus(`Computing… ${i+1}/${sampleTimes.length}`);
            }
          }

          transitCache = { key: cacheKey, sampleTimes, transitLonBySample };
        }

        const natalTargets = Array.from(new Set(candidateRules.map(r => r.natal)));
        const transitPlanets = Array.from(new Set(candidateRules.map(r => r.transit)));

        let chartRulerKey = null;
        const natalLon = {};
        if (appMode === "world"){
          chartRulerKey = null;
          cachedNatalLon = null;
        } else if (isComposite && composite){
          for (const k of natalTargets){
            natalLon[k] = (k === "mc") ? composite.mc : composite.lon[k];
          }
          chartRulerKey = chartRulerFromAsc(composite.asc);
          cachedNatalLon = natalLon;
        } else {
          const birthAllPlanets = ephemerisAstronomy.getAllPlanets(birthUTC, lon, lat, height);
          for (const k of natalTargets){
            if (k === "mc"){
              natalLon[k] = calcNatalMCDeg(birthUTC, lon);
            } else {
              natalLon[k] = getPlanetLonFromAll(birthAllPlanets, k);
            }
          }
          chartRulerKey = chartRulerFromAsc(calcNatalAscDeg(birthUTC, lon, lat));
          cachedNatalLon = natalLon;
        }

        const rulesOut = [];
        const intervalsByRule = [];
        const firstHitByRule = [];

        for (let rIdx=0; rIdx<candidateRules.length; rIdx++){
          if (cancelRequested) throw new Error("Cancelled");
          const r = candidateRules[rIdx];
          const asp = aspectAngle(r.aspect);
          const orb = Number(r.orb);

          const flags = new Array(sampleTimes.length).fill(false);
          const deltas = new Array(sampleTimes.length).fill(0);
          for (let i=0; i<sampleTimes.length; i++){
            if (cancelRequested) throw new Error("Cancelled");
            const tLon = transitLonBySample[r.transit][i];
            const nLon = (appMode === "world")
              ? transitLonBySample[r.natal][i]
              : natalLon[r.natal];
            const d = angDist(tLon, nLon);
            const delta = Math.abs(d - asp);
            deltas[i] = delta;
            if (delta <= orb) flags[i] = true;
          }

          const intervals = groupActiveIntervalsWithExact(flags, deltas, sampleTimes, endExclusive, includeRxGaps);
          if (intervals.length > 0){
            rulesOut.push(r);
            intervalsByRule.push(intervals);
            firstHitByRule.push(intervals[0][0].getTime());
          }
        }

        const idxs = rulesOut.map((_, i) => i);
        idxs.sort((a,b) => {
          const da = firstHitByRule[a] - firstHitByRule[b];
          if (da !== 0) return da;
          const pa = (orderMap.get(rulesOut[a].transit) ?? 999) - (orderMap.get(rulesOut[b].transit) ?? 999);
          if (pa !== 0) return pa;
          return (orderMap.get(rulesOut[a].natal) ?? 999) - (orderMap.get(rulesOut[b].natal) ?? 999);
        });

        const rulesSorted = idxs.map(i => rulesOut[i]);
        const intervalsSorted = idxs.map(i => intervalsByRule[i]);

        // Cache full matches, then render up to the current maxRows
        cachedResults = {
          start: rangeStartLocal,
          endExclusive,
          stepMillis,
          presetKey: activePresetKey,
          rules: rulesSorted,
          intervals: intervalsSorted,
          chartRuler: chartRulerKey
        };

        renderFromCache(currentMaxRows);
        lastTimelineRefreshAt = Date.now();

        const totalMatches = rulesSorted.length;
        const showTime = stepMillis < 24*3600*1000;
        const stepLabel = showTime ? `${Math.round(stepMillis/(3600*1000))}h` : `${Math.round(stepMillis/(24*3600*1000))}d`;
        const orbLabel = `${Number(el.orb.value || 0).toFixed(1)}°`;
        setStatus(`Done • ${stepLabel} step • ${orbLabel} orb • ${totalMatches} matches`);

      } catch (err){
        if (cancelRequested && String(err?.message || err) === "Cancelled"){
          setStatus("Cancelled.");
          cachedResults = null;
          updateShowMore(0, 0);
          return;
        }
        console.error(err);
        setStatus(String(err?.message || err), true);
        cachedResults = null;
        updateShowMore(0, 0);
      } finally {
        isComputing = false;
        cancelRequested = false;
        el.updateBtn.style.display = "none";
        el.updateBtn.disabled = false;
        if (pendingUpdate){
          pendingUpdate = false;
          updateTimeline();
        }
      }
    }

    if (el.showMoreBtn){
      el.showMoreBtn.addEventListener("click", () => {
        currentMaxRows = currentMaxRows + 50;
        renderFromCache(currentMaxRows);
      });
    }

    // init charts UI
    aspectDescriptions = await loadAspectDescriptions();
    mythDescriptions = await loadMythDescriptions();
    initCharts();
    wireChartsUI();
    wireAdvancedUI();
    wireAutoUpdate();
    wireAxisScrollSync();
    wireRangeNav();
    wireTooltipDismiss();
    wireStaleRefreshOnRefocus();
    window.addEventListener("beforeinstallprompt", () => {
      hasBeforeInstallPrompt = true;
      updateInstallHint();
    });
    window.addEventListener("appinstalled", () => {
      hasBeforeInstallPrompt = false;
      updateInstallHint();
    });
    updateInstallHint();

    el.updateBtn.addEventListener("click", () => {
      if (!isComputing) return;
      cancelRequested = true;
      setStatus("Cancelling…");
    });
    updateTimeline();
  </script>
