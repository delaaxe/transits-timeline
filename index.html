<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06070f" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Transits Timeline</title>
  <script>
    if (location.hostname === "transits-timeline.pages.dev" || location.hostname === "www.transits.me") {
      location.replace(`https://transits.me${location.pathname}${location.search}${location.hash}`);
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306070f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f0f6fc' stroke-width='2'/%3E%3Cpath d='M6 16h8' stroke='%23f0f6fc' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M20 8l2 4 4 2-4 2-2 4-2-4-4-2 4-2z' fill='%23f0f6fc'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <style>
    :root{
      color-scheme: dark;

      /* The sky is drawn by .sky; --void is what shows during overscroll and
         before it paints. */
      --void: #06070f;

      /* Two surface tokens on purpose. Anything a bar can pass behind stays
         opaque - the sticky date axis and the corner block are the reason -
         while controls may go glass. The renderer fills its own background
         rects with --panel-bg and --axis-bg, so both alias the solid one. */
      --surface-solid: #0e1122;
      --surface-glass: rgba(14,17,34,.62);
      --surface-2: #151a30;

      --hairline: #232842;
      --hairline-soft: #191e33;

      --ink: #e9ecf7;
      --ink-soft: #a6aeca;
      --ink-dim: #949cbb;
      --ink-faint: #737b99;

      --star: #f2e4be;

      /* Spacing: 6 / 10 / 16 / 24, replacing a mix of six ad-hoc values. */
      --sp-1: 6px;
      --sp-2: 10px;
      --sp-3: 16px;
      --sp-4: 24px;

      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --font-glyph: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", "Symbola", system-ui, sans-serif;

      /* Names the renderer writes straight into SVG attributes. Kept as
         aliases so no drawing code changes in this phase. */
      --bg: var(--void);
      --panel-bg: var(--surface-solid);
      --axis-bg: var(--surface-solid);
      --text: var(--ink);
      --muted: var(--ink-dim);
      --accent: var(--star);
      --accent-contrast: #06070f;
      --axis-line: #7e86a6;

      --panel-border: var(--hairline);
      --control-bg: #131731;
      --control-border: #2a3050;
      --hover: rgba(242,228,190,.10);
      --shadow: 0 16px 40px rgba(0,0,0,.55);
      --danger: #ff6b5e;

      /* Shell. The page is a column now, not the whole screen: the sky needs
         somewhere to be seen. */
      --shell-max: 1280px;
      --gutter: clamp(14px, 2.4vw, 28px);
      /* Two tokens, not one, and deliberately so: --viewbar-min sizes the bar,
         --viewbar-h is the measured result the date axis sticks below. Driving
         both from one value makes the ResizeObserver feed its own input, and a
         browser that coalesces that loop leaves the offset a few pixels short -
         which shows as a strip of rows sliding under the bar. */
      --viewbar-min: 52px;
      --viewbar-h: 52px;

      --chart-pad: 8px;
      --axis-pad: 8px;
      --timeline-nav-h: 32px;
      --timeline-nav-total: calc(var(--timeline-nav-h) + 10px);
    }
    html{
      min-height: 100%;
      background: var(--void);
    }
    body{
      font-family: var(--font-ui);
      max-width: var(--shell-max);
      margin: 0 auto;
      padding: 0 var(--gutter) max(18px, env(safe-area-inset-bottom));
      padding-inline: max(var(--gutter), env(safe-area-inset-left)) max(var(--gutter), env(safe-area-inset-right));
      color: var(--text);
      font-size: 16px;
      background: transparent;
      overscroll-behavior-y: none;
    }

    .appBar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-3);
      padding: max(var(--sp-2), env(safe-area-inset-top)) 0 var(--sp-2);
    }
    .wordmark{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .wordmark svg{
      width: 20px;
      height: 20px;
      flex: none;
      color: var(--star);
    }

    /* The sky. Three radial washes for the nebula, a vignette, a grain tile to
       stop the gradients banding on OLED, and two star fields as children.
       All CSS: no canvas and no per-frame JS, so a drag still has the main
       thread to itself. A fixed element rather than background-attachment:
       fixed, which repaints every scroll frame on iOS. */
    .sky{
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAQAAABKfvVzAAAEGUlEQVR42g3Ti08QVBQG8Ktu59xz77nnXucj0RRtMlMSXzRXiSYyHySZUOpSTERQsTJcivNBQpipG762fBCROS0tRWUjxWmU+UINp1OGj7U5RMPUwgwfofEXfN9+3z61XVeFTtjfdpUP4CW+hIuxFoZRpD8N2ZBgLukhvlim4DQ7QLr7bn62U5ftXX/LbqYp1NtvlmZ7w0ThJV2qH3P70Eu+tmX+qf8D+5nG0AO+CnVGHQv74E87wb/mutEGncsnXW99gwv1VSnkH8MvlITv6gUhBx76VLMWElkd9tt0F3eSz/DL7iykYZZLwT2+MyqfJIOswyxfqfNshRuKj9wDV4JqDJaaB9rSQe1kU4gxh3Q5fRfm+XQ6S5nynxVY4wpor9tve1Ms/UXqB2ryyu0N0SGOM91k3oVV7iyO18Mhyd8Nib4xlOkRgCFWRnE6iVHvm8V+R4tGpG0INRIvSUIu1bfWk3Sjj5NI24RdKc10wJsieN1mGnVT/pFcKZCZbiQP5es2KizmKCrCceGQztP3qD8/0vNaCH6zNVRu+1lFtsER75SN0h3nY7RZDVNMPBfw2BbivqarrsWV0Nf08dm4Am/BblEXTTwswmQToWeaL2W2qZPJZh8sA4Q0uU91eC00yykppvk2I4zifaDioWfI5xSIDkdlrV9innNT9UrXylTY7dTWzLWp8D33cYWSSa1bMsaw6sDWFIWcls4nbLNe5xPhiowSHeajh4RwACtdRKCw1K2Alr1DD6fycAXNptvuKD4IGyAD37D5ocgnwL/w0Aykx2a9u+uGSKaJdto0YL1Rx2kOxujP7Ai/BivoqTsF4+FJqOct+qKttHFW2d0cR2DybA8+4XtZdcV0MrGwPoylz3kr/cQSzsgsjOB6PzKsdxEyXP/NpWaTWc6LTJOcQvVOSMYseSofuV3usp5OMbpUYuwiW+BnwgW+IHN4lY10hf6A/hBX0a+s6rgEhkOtewxRfM99gvN0kgwODdgeXqd2oUgvk99xIG6W6bycFGxxqtAucQslF86HYrD0LNTgp1RrP3ZtbY2tojbmBWqmElrgss1GbPbvkXrIz/tE7kLsR3NnmMr19hV826bpe1ASfrY73QRshWuwjIdJFpeba6gi3AxbR9ttI5ynaqiEOxhp0nG3XW07mm/MJugBOXjfHTNX3QiXCkVaLbTb3EH/omTweDqHbd0OfRl7mmgawM/cJErg236hDDVfmJU232S4XK2W0ptmWovxMloQBoU7EAv36YZtb3IwgtLxiEx2y0MbLKN2do/uSPmgZsG3fESX4CxoliY8h1VhXIgJKbyK14Vi7mzK+SJUhBlcTW34LX4VVbWvcCkaYXQ4jYdlot5vkmUiDuYntEV3dFvhOCaHbF/tZ7Tcai6ckf8BKzw3p4kZuu0AAAAASUVORK5CYII=") repeat 0 0 / 24px 24px,
        radial-gradient(122% 90% at 50% 32%, transparent 58%, rgba(0,0,0,.42) 100%),
        radial-gradient(1100px 720px at 12% -8%, rgba(123,92,214,.32), transparent 62%),
        radial-gradient(900px 640px at 88% 4%, rgba(46,127,140,.24), transparent 60%),
        radial-gradient(820px 620px at 62% 106%, rgba(180,86,110,.18), transparent 62%),
        var(--void);
    }
    .sky::before,
    .sky::after{
      content: "";
      position: absolute;
      inset: -8%;
    }
    /* Near field: fewer, brighter, one of them warm. */
    .sky::before{
      background-image:
        radial-gradient(1.6px 1.6px at 40px 62px, rgba(255,255,255,.95), transparent 60%),
        radial-gradient(1.4px 1.4px at 168px 22px, rgba(242,228,190,.85), transparent 60%),
        radial-gradient(1.2px 1.2px at 96px 190px, rgba(255,255,255,.75), transparent 60%),
        radial-gradient(1.8px 1.8px at 232px 132px, rgba(255,255,255,.70), transparent 60%);
      background-size: 260px 260px;
      animation: starDrift 260s linear infinite;
    }
    /* Far field: more of them, dimmer, on a tile whose size shares no factor
       with the near one, so the two repeats never line up. */
    .sky::after{
      background-image:
        radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.55), transparent 60%),
        radial-gradient(1px 1px at 110px 96px, rgba(255,255,255,.45), transparent 60%),
        radial-gradient(1px 1px at 60px 148px, rgba(198,210,255,.45), transparent 60%),
        radial-gradient(1px 1px at 172px 58px, rgba(255,255,255,.35), transparent 60%),
        radial-gradient(1px 1px at 140px 178px, rgba(255,255,255,.40), transparent 60%);
      background-size: 190px 190px;
      opacity: .9;
      animation: starDrift 420s linear infinite reverse;
    }
    @keyframes starDrift{
      from{ transform: translate3d(0,0,0); }
      to{ transform: translate3d(-190px, -140px, 0); }
    }
    /* Still on touch: nothing compositing behind a chart while a finger is on
       the glass, and no battery spent on motion nobody asked for. */
    @media (prefers-reduced-motion: reduce), (hover: none) and (pointer: coarse){
      .sky::before,
      .sky::after{ animation: none; }
    }

    :focus-visible{
      outline: 2px solid var(--star);
      outline-offset: 2px;
    }

    .panel{
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: var(--sp-3);
      margin-bottom: var(--sp-3);
      background: var(--surface-glass);
      backdrop-filter: blur(10px) saturate(115%);
      -webkit-backdrop-filter: blur(10px) saturate(115%);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      .panel,
      .installHint{ background: var(--surface-solid); }
    }
    .row{ display:flex; gap:12px; flex-wrap: wrap; align-items:flex-end; }
    label{ display:block; font-size: 12px; color:var(--muted); margin-bottom: 6px; }
    input, select, button{ font: inherit; padding: 8px 10px; border:1px solid var(--control-border); border-radius: 8px; background: var(--control-bg); color: var(--text); }
    input[type="number"],
    input[type="date"],
    input[type="time"]{ font-variant-numeric: tabular-nums; }
    input[type="number"]{ width: 110px; }
    input[type="date"]{ width: 132px; } /* narrower */
    input[type="time"]{ width: 130px; }
    .field{ display:flex; flex-direction: column; }
    .field.small input, .field.small select { width: 160px; }
    .field.med input, .field.med select { width: 210px; }
    button{ cursor:pointer; border-color: var(--control-border); }
    button:disabled{ opacity:.6; cursor: not-allowed; }

    .status{ margin-top: 10px; color: var(--muted); font-size: 13px; white-space: normal; }
    .error{ color: var(--danger); }

    /* The view bar, the options drawer, the date axis and the chart are four
       elements that have to read as one plate: same surface, one border drawn
       around the outside of the set. The bar is sticky above the axis, which
       is why --viewbar-h exists - the axis sticks to the bottom edge of it. */
    .viewBar{
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--sp-1) var(--sp-2);
      min-height: var(--viewbar-min);
      padding: var(--sp-1) var(--sp-2);
      background: var(--surface-solid);
      border: 1px solid var(--hairline);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
    }
    .viewBarToggle{ flex: none; white-space: nowrap; }
    .optionsDrawer{
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      padding: var(--sp-3);
      background: var(--surface-solid);
      border-inline: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline-soft);
    }
    .dateAxisScroll{
      position: sticky;
      top: var(--viewbar-h);
      z-index: 3;
      background: var(--panel-bg);
      overflow: hidden;
      border-inline: 1px solid var(--hairline);
    }

    /* The date axis sits outside the scroller, so it used to be repositioned by
       JS on every scroll event and lagged behind touch scrolling. Tying it to a
       scroll timeline lets the compositor drive it. updateAxisTransform still
       does the work where scroll timelines are unsupported. */
    #timelineScroll{ scroll-timeline: --timelineX inline; }
    body{ timeline-scope: --timelineX; }

    @keyframes dateAxisFollow{
      from{ transform: translateX(0); }
      to{ transform: translateX(calc(-1 * var(--date-axis-travel, 0px))); }
    }

    @supports (animation-timeline: --x){
      /* Longhand on purpose: the animation shorthand resets duration to 0s,
         which finishes a scroll-driven animation instantly at 100%. */
      #dateAxisSvg{
        animation-name: dateAxisFollow;
        animation-duration: auto;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-timeline: --timelineX;
      }

      /* The label column slides and narrows over the first stretch of scroll,
         then holds. The hold is a keyframe stop rather than animation-range,
         and the values are plain lengths rather than a custom property, because
         Safari runs neither of those on a scroll timeline. syncAxisAnimations
         writes the keyframes, since the stop depends on the layout. */
      #aspectAxisWrap{ animation-name: aspectAxisNarrow; }
      #aspectAxisSvg{ animation-name: aspectAxisSlide; }
      #axisCornerBlock{ animation-name: aspectAxisCornerNarrow; }
      .timelineNav{ animation-name: aspectAxisNavIndent; }

      #aspectAxisWrap,
      #aspectAxisSvg,
      #axisCornerBlock,
      .timelineNav{
        animation-duration: auto;
        animation-timing-function: linear;
        animation-fill-mode: both;
        animation-timeline: --timelineX;
      }
    }
    .dateAxisScrollInner{ padding: var(--axis-pad); position: relative; }
    .timelineNav{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 2px 0 4px;
      margin-left: calc(calc(var(--aspect-axis-w, 150px) + var(--aspect-axis-shift, 0px)) + var(--axis-pad));
      margin-right: 6px;
      user-select: none;
      min-height: var(--timeline-nav-h);
    }
    .timelineNavGroup{ display:flex; gap: 14px; }
    .timelineNavBtn{
      background: none;
      border: none;
      padding: 0;
      color: var(--ink-soft);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }
    .timelineNavBtn:disabled{ opacity: 0.5; cursor: not-allowed; }
    #dateAxisSvg{ will-change: transform; position: relative; z-index: 1; }
    #axisCornerBlock{
      position: absolute;
      left: var(--axis-pad);
      top: var(--axis-pad);
      width: calc(calc(var(--aspect-axis-w, 150px) + var(--aspect-axis-shift, 0px)) - 1px);
      height: calc(var(--date-axis-h, 80px) + var(--timeline-nav-total, 0px));
      background: var(--panel-bg);
      z-index: 2;
      pointer-events: none;
      display: none;
    }
    .chartFrame{
      position: relative;
      border: 1px solid var(--hairline);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
    }
    .timelineScroll{ border: 0; border-radius: 0; padding: var(--chart-pad); background: var(--panel-bg); overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch; }
    svg{ display:block; width: 100%; }
    #aspectAxisWrap{
      position: absolute;
      left: var(--chart-pad);
      top: var(--chart-pad);
      z-index: 2;
      overflow: hidden;
      width: calc(var(--aspect-axis-w, 150px) + var(--aspect-axis-shift, 0px));
      pointer-events: none;
    }
    #aspectAxisSvg{
      display: block;
      transform: translateX(var(--aspect-axis-shift, 0px));
    }
    #aspectAxisSvg text,
    #dateAxisSvg text{ font-family: var(--font-glyph); }
    .checks{ display:flex; gap: 14px; align-items:center; flex-wrap: wrap; padding: 6px 0 2px 0; }
    .checks label{ margin: 0; font-size: 13px; color: var(--text); display:flex; gap: 8px; align-items:center; }
    .checks input[type="checkbox"]{ width: 16px; height: 16px; accent-color: var(--star); }
    .optionsDrawer > *{ margin-top: 0; }
    .aspectDropdown{ position: relative; }
    .aspectDropdown > summary{
      list-style: none;
      cursor: pointer;
      padding: 6px 10px;
      border: 1px solid var(--control-border);
      border-radius: 8px;
      background: var(--control-bg);
      font-size: 13px;
      color: var(--text);
      user-select: none;
    }
    .aspectDropdown > summary::-webkit-details-marker{ display: none; }
    .aspectDropdown[open] > summary{ background: var(--star); border-color: var(--star); color: var(--accent-contrast); }
    .aspectDropdown .aspectPanel{
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      padding: var(--sp-2);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      background: var(--surface-solid);
      box-shadow: var(--shadow);
      min-width: 220px;
      z-index: 20;
    }

    .inlineHint{ font-size: 12px; color: var(--muted); margin-left: 2px; margin-right: 2px; }
    .chartLinks{ display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .chartPrivacy{ margin-top: 8px; font-size: 12px; color: var(--muted); }
    .inlineDot{ color: var(--muted); margin: 0; }
    [data-advanced][hidden]{ display: none; }

    
    .orbField input{ width: 70px !important; }
    .orbInline{ display:flex; align-items:center; gap: 8px; }
    .orbInline label{ margin: 0; font-size: 12px; color: var(--muted); }
    .smallBtn{ padding: 6px 10px; font-size: 13px; border-radius: 8px; }

    
    .typeahead{ position: relative; }
    .suggestBox{
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface-solid);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      box-shadow: var(--shadow);
      max-height: 260px;
      overflow: auto;
      z-index: 30;
    }
    .suggestItem{ padding: 10px 12px; cursor: pointer; }
    .suggestItem:hover{ background: var(--hover); }
    .suggestTitle{ font-size: 14px; }
    .suggestSub{ font-size: 12px; color: var(--muted); margin-top: 2px; }
    .rowTop{ align-items: flex-end; }
    .tinyHelp{ font-size: 12px; color: var(--muted); margin-top: 6px; }
    
    .chartSummary{
      font-size: 13px;
      color: var(--muted);
      padding: 6px 0 0 0;
      line-height: 1.35;
      white-space: pre-line;
    }
    .symbolGlyphText{
      font-family: var(--font-glyph);
      font-size: 14px;
    }
    .composeHint{
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .composeStopRow{
      margin-top: 4px;
      display: flex;
      justify-content: flex-start;
    }
    .btnSmallPrimary{
      background: var(--star);
      color: var(--accent-contrast);
      border: 1px solid var(--star);
      padding: 7px 10px;
      font-size: 13px;
      border-radius: 8px;
    }
    .btnSmallPrimary:hover{ opacity: .92; }

    .btnGhost{
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
    }

    .statusRow{ display:flex; align-items:center; gap: var(--sp-2); flex-wrap: wrap; }
    .statusRow .status{ margin-top: 0; }
    .linkBtn{
      background: none;
      border: none;
      padding: 0;
      color: var(--ink-soft);
      cursor: pointer;
      text-decoration: underline;
      font-size: 13px;
    }
    .linkBtn:hover{ opacity: .75; }

    /* Size for the hand, not for the viewport. An iPad mini in landscape is
       1133px wide and still held in two hands, so this keys off the pointer
       rather than a breakpoint. --timeline-nav-total follows automatically,
       which is what keeps the corner block covering the nav. */
    @media (hover: none) and (pointer: coarse){
      :root{
        --timeline-nav-h: 44px;
        --viewbar-min: 60px;
        --viewbar-h: 60px;
      }
      .timelineNavBtn{ min-width: 44px; min-height: 44px; }
      .presetBtn,
      .chartBtn,
      .aspectDropdown > summary{ min-height: 40px; padding-inline: 14px; }
      .linkBtn{ padding: 8px 0; }
      .checks label{ min-height: 32px; }
    }

    @media (max-width: 520px){
      :root{ --chart-pad: 0px; --axis-pad: 0px; }

      /* The plate goes edge to edge by taking the page's gutters away, not by
         being 100vw wide. 100vw counts the scrollbar where the scrollbar takes
         layout space, which put the right-hand end of the view bar - the
         options toggle - just off screen on a narrow desktop window. */
      body{ padding-inline: 0; }
      .appBar,
      .panel,
      .installHint{
        margin-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
      }
      .viewBar,
      .optionsDrawer,
      .dateAxisScroll,
      .chartFrame{
        border-inline: 0;
        border-radius: 0;
      }
      .viewBar,
      .optionsDrawer{
        padding-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
      }
      .presetBtn{ padding-inline: 10px; }
      .dateAxisScrollInner{ padding: 0; }
      .timelineScroll{ padding: 0; border-radius: 0; width: 100%; margin: 0; }
      #axisCornerBlock{ display: block; }
      .timelineNavGroup:last-child .timelineNavBtn:last-child{ margin-right: 10px; }
      .rowPlanets{ margin-top: 0 !important; }
      .rowPlanets{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
      .rowPlanets .field:nth-child(3){ grid-column: 1 / -1; }
      .rowPlanets .field select{ width: 100%; }
    }

    .chartButtons{ display:flex; gap: 8px; flex-wrap: wrap; }
    .chartBtn{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      font-size: 13px;
      cursor: pointer;
    }
    .chartBtn.active{
      background: var(--star);
      border-color: var(--star);
      color: var(--accent-contrast);
    }
    .chartBtn.add{
      border-style: dashed;
    }
    .chartPickers{ display: flex; flex-direction: column; gap: 10px; }
    .chartPickerLabel{ font-size: 12px; color: var(--muted); margin: 0 0 6px; }
    .appModeLinks{
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .appModeLink{ text-decoration: underline; font-size: 15px; }
    .appModeLink.active{ text-decoration: none; font-weight: 700; color: var(--star); }

    .presetButtons{ display:flex; gap: 8px; flex-wrap: wrap; }
    .presetBtn{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--control-border);
      background: var(--control-bg);
      font-size: 13px;
      cursor: pointer;
    }
    .presetBtn.active{
      background: var(--star);
      border-color: var(--star);
      color: var(--accent-contrast);
    }

    #tooltip{
      position: fixed; z-index: 9999; left: 0; top: 0; display: none; pointer-events: none;
      padding: 8px 10px; border-radius: 12px; background: var(--surface-solid); color: var(--text);
      border: 1px solid var(--hairline);
      font-size: 14px; line-height: 1.25; width: 90vw; max-width: 560px; box-shadow: 0 14px 30px rgba(0,0,0,0.55);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      white-space: normal; visibility: hidden;
    }
    #tooltipBackdrop{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9998;
      display: none;
    }
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
      #tooltipBackdrop{
        background: rgba(0,0,0,0);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
    }
    #tooltip.popup{
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }
    #tooltip .tooltipClose{
      position: absolute;
      right: 10px;
      top: 8px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
    }
    #tooltip .tooltipTitle{ font-size: 16px; }
    #tooltip.popup .tooltipTitle{ cursor: pointer; }
    #tooltip .copiedHint{
      margin-left: 6px;
      color: var(--muted);
      font-size: 13px;
      opacity: 0;
      transition: none;
    }
    #tooltip .copiedHint.visible{
      opacity: 0.65;
      transition: none;
    }
    #tooltip .copiedHint.fading{
      opacity: 0;
      transition: opacity 700ms ease;
    }
    #tooltip .desc{ opacity: 0.95; margin-top: 6px; }
    #tooltip .sub{ opacity: 0.85; margin-top: 4px; white-space: normal; }
    #tooltip .myth{ opacity: 0.9; margin-top: 6px; font-style: italic; }
    #tooltip .mythToggle{
      margin-top: 6px;
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    #tooltip .tooltipCalendarBlock{
      margin-top: 12px;
    }
    #tooltip .tooltipActions{
      font-size: 13px;
      line-height: 1.4;
      display: block;
    }
    #tooltip .tooltipActionsLabel{ margin-right: 0; }
    #tooltip .tooltipActionsSep{
      opacity: 0.75;
      margin: 0;
    }
    #tooltip .tooltipAction{
      color: var(--text);
      text-decoration: underline;
      font-size: 13px;
      display: inline-block;
      padding: 6px 4px;
      border-radius: 6px;
      margin: 2px 0;
    }
    #tooltip .tooltipAction:active{ background: var(--hover); }
    .bar{ cursor: pointer; }
    .installHint{
      margin: var(--sp-3) 0 0;
      padding: var(--sp-2) 12px;
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: var(--surface-glass);
      backdrop-filter: blur(10px) saturate(115%);
      -webkit-backdrop-filter: blur(10px) saturate(115%);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    .installHintTitle{
      color: var(--text);
      font-weight: 600;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="sky" aria-hidden="true"></div>

  <header class="appBar">
    <span class="wordmark">
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M6 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path d="M20 8l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="currentColor" />
      </svg>
      Transits
    </span>
    <div class="appModeLinks" role="listbox" aria-label="Mode">
      <button id="appModePersonalBtn" type="button" class="linkBtn appModeLink active" aria-selected="true">Personal</button>
      <span class="inlineDot" aria-hidden="true">•</span>
      <button id="appModeWorldBtn" type="button" class="linkBtn appModeLink" aria-selected="false">World</button>
    </div>
  </header>

  <div class="panel" id="personalPanel">
    <div id="personalSection">
    <div class="row rowTop">
      <div class="field med" style="min-width: 260px; flex: 1;">
        <label>Chart</label>
        <div class="chartPickers">
          <div class="chartPicker">
            <div id="chartButtons" class="chartButtons" role="listbox" aria-label="Chart A"></div>
            <div class="chartLinks" id="chartLinks">
              <button id="chartSummaryToggle" type="button" class="linkBtn" aria-expanded="false">Show data</button>
              <span class="inlineDot" id="composeDot">·</span>
              <button id="composeToggle" type="button" class="linkBtn" aria-expanded="false">Compose</button>
              <span class="inlineDot" id="deleteDot">·</span>
              <button id="deleteChartBtn" type="button" class="linkBtn" title="Delete chart" aria-label="Delete chart">Delete</button>
            </div>
            <div id="chartPrivacy" class="chartPrivacy" hidden>Your data is private (stored locally).</div>
          </div>
          <div class="chartPicker" id="chartPickerB" hidden>
            <div class="chartPickerLabel">Compose with</div>
            <div id="chartButtonsB" class="chartButtons" role="listbox" aria-label="Chart B"></div>
          </div>
          <div id="composeHint" class="composeHint" hidden></div>
          <div id="composeStopRow" class="composeStopRow" hidden>
            <button id="composeStopBtn" type="button" class="linkBtn">Stop composing</button>
          </div>
        </div>
      </div>
    </div>
    <div id="chartSummary" class="chartSummary" hidden></div>

    <div id="addChartPanel" class="row rowTop" style="margin-top:10px; display:none;">
      <div class="field med"><label>Name</label><input id="addChartName" type="text" placeholder="Name" /></div>
      <div class="field med"><label>Birth date</label><input id="addChartBirthDate" type="date" value="1990-09-01" /></div>
      <div class="field med"><label>Birth time (local)</label><input id="addChartBirthTime" type="time" value="18:11" step="60" /></div>

      <div class="field med typeahead">
        <label>Birth place</label>
        <input id="placeSearch" type="text" placeholder="City, country" autocomplete="off" />
        <div id="placeSuggest" class="suggestBox" hidden></div>
      </div>

      <div class="field small"><label>&nbsp;</label><button id="saveChartBtn" type="button" class="btnSmallPrimary">Save</button></div>
      <div class="field small"><label>&nbsp;</label><button id="cancelAddBtn" type="button" class="btnGhost">Cancel</button></div>
    </div>
    </div>
  </div>

<div id="mainContent">
  <div class="viewBar" id="viewBar">
    <div id="presetButtons" class="presetButtons" role="listbox" aria-label="Preset"></div>
    <button id="advancedToggle" type="button" class="linkBtn viewBarToggle" aria-expanded="false">Show options</button>
  </div>

  <div class="optionsDrawer" data-advanced>
    <div class="row optionsRow">
      <div class="field"><label>Start</label><input id="rangeStart" type="date" value="2025-10-01" /></div>
      <div class="field"><label>End</label><input id="rangeEnd" type="date" value="2026-12-31" /></div>
    </div>

    <div class="row rowPlanets">
      <div class="field med"><label>Planets</label><select id="transitGroup"></select></div>
      <div class="field med" id="natalGroupField"><label>Natal targets</label><select id="natalGroup"></select></div>
      <div class="field">
        <div class="checks" style="padding:0;">
          <label><input id="includeMoon" type="checkbox" checked /> Transiting Moon</label>
          <label><input id="includeChiron" type="checkbox" checked /> Chiron</label>
          <label><input id="includeNode" type="checkbox" /> Node</label>
          <label id="includeMCWrap"><input id="includeMC" type="checkbox" checked /> Mc</label>
        </div>
      </div>
    </div>

    <div class="checks" id="topChecks">
      <details class="aspectDropdown">
        <summary>Aspects</summary>
        <div class="aspectPanel">
          <div class="checks" id="aspectChecks" style="padding:0; gap:12px;"></div>
          <div class="orbInline orbField" style="margin-top: 8px;">
            <label for="orb">Orb (°)</label>
            <input id="orb" type="number" value="1.0" step="0.1" />
          </div>
        </div>
      </details>
    </div>

    <div class="statusRow">
      <button id="updateBtn" type="button" class="linkBtn" style="display:none;">Cancel</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="dateAxisScroll" id="dateAxisScroll">
    <div class="dateAxisScrollInner">
      <div class="timelineNav" data-advanced>
        <div class="timelineNavGroup">
          <button class="timelineNavBtn" id="rangeShiftBack" type="button" aria-label="Shift range backward" title="Shift backward">‹</button>
          <button class="timelineNavBtn" id="rangeExpandBack" type="button" aria-label="Extend range backward" title="Extend backward">«</button>
        </div>
        <div class="timelineNavGroup">
          <button class="timelineNavBtn" id="rangeExpandForward" type="button" aria-label="Extend range forward" title="Extend forward">»</button>
          <button class="timelineNavBtn" id="rangeShiftForward" type="button" aria-label="Shift range forward" title="Shift forward">›</button>
        </div>
      </div>
      <svg id="dateAxisSvg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-label="Date axis"></svg>
      <div id="axisCornerBlock" aria-hidden="true"></div>
    </div>
  </div>
  <div class="chartFrame">
    <div id="aspectAxisWrap">
      <svg id="aspectAxisSvg" width="160" height="280" viewBox="0 0 160 280" role="img" aria-label="Aspect axis"></svg>
    </div>
    <div class="timelineScroll" id="timelineScroll">
      <svg id="timelineSvg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Transit timeline"></svg>
    </div>
    <div id="moreWrap" style="margin-top: 8px; display: none; padding-left: 245px;">
      <button id="showMoreBtn" class="linkBtn" type="button">Show 50 more</button>
    </div>
  </div>
  </div>
  <div id="installHint" class="installHint" hidden>
    <div class="installHintTitle">Add this app to your home screen</div>
    <div id="installHintText"></div>
  </div>
  <div id="tooltipBackdrop" aria-hidden="true"></div>
  <div id="tooltip" aria-hidden="true"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
